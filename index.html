<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FRC Scouting</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 16px;
      color: #222;
      background: #fff;
    }
    input, button, select, textarea {
      font-family: inherit;
    }
    table {
      border-collapse: collapse;
      margin-top: 10px;
      width: 100%;
      font-size: 13px;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 4px 8px;
    }
    th {
      background: #eee;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }
    th:hover {
      background: #e2e2e2;
    }
    .tabs {
      border-bottom: 1px solid #ccc;
      margin-bottom: 14px;
      display: flex;
      gap: 4px;
    }
    .tab-btn {
      padding: 6px 16px;
      cursor: pointer;
      border: 1px solid #ccc;
      background: #eee;
      margin-bottom: -1px;
      border-radius: 3px 3px 0 0;
      font-size: 13px;
    }
    .tab-btn.active {
      background: #fff;
      border-bottom: 1px solid #fff;
      font-weight: bold;
    }
    .btn {
      padding: 5px 12px;
      background-color: #f0f0f0;
      border: 1px solid #bbb;
      border-radius: 3px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
    }
    .btn:hover {
      background-color: #e5e5e5;
    }
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .input-txt {
      padding: 4px 8px;
      border: 1px solid #ccc;
      border-radius: 2px;
      font-size: 13px;
    }
    .status-ok { color: #070; }
    .status-err { color: #b00; font-weight: bold; }
    .status-normal { color: #333; }
    .card {
      background: #fafafa;
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 12px;
      margin-top: 10px;
    }
  </style>
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const DEFAULT_SUPABASE_URL = "https://hiidxcirfnetdaagfsuh.supabase.co/functions/v1/analyze-video";
    const TBA_BASE = "https://www.thebluealliance.com/api/v3";
    const SB_BASE = "https://api.statbotics.io/v3";

    const HEADERS = [
      'Team', 'Year', 'Most Recent EPA',
      'Week 1 OPR', 'Week 2 OPR', 'Week 3 OPR', 'Week 4 OPR',
      'Week 5 OPR', 'Week 6 OPR', 'Week 7 OPR', 'Worlds OPR',
      'Off-season 2', 'Off-season 3', 'Off-season 4', 'Off-season 5', 'Off-season 6',
    ];

    const round2 = (val) => Math.round(val * 100) / 100;

    function parseYearExpression(expr) {
      if (!expr || !expr.trim()) return [new Date().getFullYear()];
      const cleaned = expr.replace(/\s+/g, '');
      const years = new Set();
      for (const part of cleaned.split(',')) {
        if (!part) continue;
        if (part.includes('-')) {
          const [aStr, bStr] = part.split('-');
          const a = parseInt(aStr, 10);
          const b = parseInt(bStr, 10);
          if (!isNaN(a) && !isNaN(b)) {
            const start = Math.min(a, b);
            const end = Math.max(a, b);
            for (let y = start; y <= end; y++) years.add(y);
          }
        } else {
          const y = parseInt(part, 10);
          if (!isNaN(y)) years.add(y);
        }
      }
      const arr = Array.from(years).sort((a, b) => b - a);
      return arr.length ? arr : [new Date().getFullYear()];
    }

    function pickEpaFromPayload(json) {
      if (!json) return '';
      let j = json;
      if (Array.isArray(j)) j = j[0];
      if (Array.isArray(j?.results)) j = j.results[0];
      if (!j) return '';

      const epaObj = j.epa || {};
      const candidates = [
        epaObj.total_points?.mean,
        epaObj.total_points?.value,
        typeof epaObj.total_points === 'number' ? epaObj.total_points : null,
        epaObj.stats?.end,
        epaObj.stats?.pre_champs,
        j.epa_end,
        j.epa_mean,
        j.stats?.epa?.end,
        j.recent_epa,
      ];

      for (const c of candidates) {
        if (typeof c === 'number' && !isNaN(c)) return round2(c);
      }
      return '';
    }

    function findTeamEntryInJson(root, teamNum) {
      const want = String(teamNum);
      const stack = [root];
      while (stack.length) {
        const x = stack.pop();
        if (x && typeof x === 'object') {
          if (!Array.isArray(x)) {
            const id = x.team ?? x.team_number ?? x.team_key ?? x.number;
            if (id != null && String(id).replace(/^frc/i, '') === want && pickEpaFromPayload(x) !== '') {
              return x;
            }
          }
          for (const k of Object.keys(x)) {
            stack.push(x[k]);
          }
        }
      }
      return null;
    }

    async function fetchWithTimeout(url, timeoutMs = 4000) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeoutMs);
      try {
        const res = await fetch(url, { signal: controller.signal });
        clearTimeout(timer);
        return res;
      } catch (err) {
        clearTimeout(timer);
        throw err;
      }
    }

    function App() {
      // Navigation
      const [activeTab, setActiveTab] = useState('data');

      // TBA Key & Supabase URL
      const [tbaKey, setTbaKey] = useState(() => localStorage.getItem('tbakey') || '');
      const [functionUrl, setFunctionUrl] = useState(() => localStorage.getItem('supabase_function_url') || DEFAULT_SUPABASE_URL);

      // Tab 1: Data / Matrix (clean empty defaults)
      const [sourceInput, setSourceInput] = useState('');
      const [yearsInput, setYearsInput] = useState('');
      const [matrixRows, setMatrixRows] = useState([]);
      const [statusMessage, setStatusMessage] = useState('');
      const [statusType, setStatusType] = useState('normal');
      const [loadingMatrix, setLoadingMatrix] = useState(false);
      const [sortCol, setSortCol] = useState(2); // Most Recent EPA
      const [sortAsc, setSortAsc] = useState(false);

      // Debug EPA
      const [showDebug, setShowDebug] = useState(false);
      const [debugOutput, setDebugOutput] = useState('');
      const [loadingDebug, setLoadingDebug] = useState(false);

      // Tab 2: Video Analyzing (clean empty defaults)
      const [vTeam, setVTeam] = useState('');
      const [vYears, setVYears] = useState('');
      const [vOnlyVideo, setVOnlyVideo] = useState(true);
      const [vStatus, setVStatus] = useState('');
      const [vStatusType, setVStatusType] = useState('normal');
      const [loadingVideos, setLoadingVideos] = useState(false);
      const [videoMatches, setVideoMatches] = useState([]);
      const [clipTimes, setClipTimes] = useState({});
      const [analyzingKey, setAnalyzingKey] = useState(null);
      const [analysisResults, setAnalysisResults] = useState({});
      const [activeAnalysisView, setActiveAnalysisView] = useState(null);

      // Tab 3: Saved Reports
      const [savedReports, setSavedReports] = useState(() => {
        try {
          return JSON.parse(localStorage.getItem('frc_saved_reports') || '[]');
        } catch {
          return [];
        }
      });

      useEffect(() => {
        localStorage.setItem('tbakey', tbaKey.trim());
      }, [tbaKey]);

      useEffect(() => {
        localStorage.setItem('supabase_function_url', functionUrl.trim());
      }, [functionUrl]);

      useEffect(() => {
        localStorage.setItem('frc_saved_reports', JSON.stringify(savedReports));
      }, [savedReports]);

      // TBA Helper
      const fetchTBA = async (endpoint) => {
        const key = tbaKey.trim();
        const headers = key ? { 'X-TBA-Auth-Key': key } : {};
        const res = await fetch(`${TBA_BASE}${endpoint}`, { headers });
        if (res.status === 401) {
          throw new Error('TBA rejected API key (401 Unauthorized)');
        }
        if (!res.ok) {
          if (res.status === 404) return null;
          throw new Error(`TBA error HTTP ${res.status}`);
        }
        return res.json();
      };

      // EPA Fetch with Fallbacks
      const fetchEpaWithFallbacks = async (team, year, lastEventKey) => {
        const candidates = [
          { label: 'season lookup', url: `${SB_BASE}/team_year/${team}/${year}` },
          ...(lastEventKey ? [{ label: 'last-event lookup', url: `${SB_BASE}/team_event/${team}/${lastEventKey}` }] : []),
          { label: 'team_years lookup', url: `${SB_BASE}/team_years?team=${team}&year=${year}` },
          ...(lastEventKey ? [{ label: 'event-list lookup', url: `${SB_BASE}/team_events?event=${lastEventKey}&limit=1000`, isList: true }] : []),
        ];

        for (const { label, url, isList } of candidates) {
          try {
            const response = await fetchWithTimeout(url, 3500);
            if (!response.ok) continue;
            const json = await response.json();
            if (isList) {
              const entry = findTeamEntryInJson(json, team);
              if (entry) {
                const val = pickEpaFromPayload(entry);
                if (val !== '') return { value: val, details: label };
              }
            } else {
              const val = pickEpaFromPayload(json);
              if (val !== '') return { value: val, details: label };
            }
          } catch (err) {}
        }
        return { value: '', details: 'all lookups failed' };
      };

      // Resolve Teams for Tab 1
      const resolveTeams = async (inputStr, rosterYear) => {
        const trimmed = inputStr.trim();
        if (!trimmed) throw new Error('Enter an event name, event link, event key, or team number(s)');

        if (/^[\d,\s]+$/.test(trimmed)) {
          const numbers = Array.from(new Set((trimmed.match(/\d+/g) || []).map(Number)));
          const out = [];
          for (const n of numbers) {
            try {
              const s = await fetchTBA(`/team/frc${n}/simple`);
              out.push({ num: n, name: s ? s.nickname : '' });
            } catch {
              out.push({ num: n, name: '' });
            }
          }
          return out;
        }

        let m = trimmed.match(/frc-events\.firstinspires\.org\/(\d{4})\/([A-Za-z0-9]+)/i);
        if (m) return teamsFromEvent(m[1] + m[2].toLowerCase());
        m = trimmed.match(/thebluealliance\.com\/event\/(\d{4}[A-Za-z0-9]+)/i);
        if (m) return teamsFromEvent(m[1].toLowerCase());

        if (/^\d{4}(?=[a-z0-9]*[a-z])[a-z0-9]+$/i.test(trimmed)) {
          return teamsFromEvent(trimmed.toLowerCase());
        }

        const evs = (await fetchTBA(`/events/${rosterYear}/simple`)) || [];
        const words = trimmed.toLowerCase().split(/\s+/);
        const hits = evs.filter((e) => words.every((w) => `${e.name} ${e.key}`.toLowerCase().includes(w)));
        if (!hits.length) throw new Error(`No ${rosterYear} event found matching "${trimmed}"`);
        let pick = hits.length === 1 ? hits[0] : hits.find((e) => e.name.toLowerCase() === trimmed.toLowerCase());
        if (!pick) pick = hits[0];

        setStatusMessage(`Using event: ${pick.name} (${pick.key})`);
        return teamsFromEvent(pick.key);
      };

      const teamsFromEvent = async (eventKey) => {
        const teams = await fetchTBA(`/event/${eventKey}/teams/simple`);
        if (!teams || !teams.length) throw new Error(`No teams found for event ${eventKey}`);
        return teams.map((t) => ({ num: t.team_number, name: t.nickname || '' })).sort((a, b) => a.num - b.num);
      };

      // Load Tab 1 Matrix
      const handleLoadData = async () => {
        setLoadingMatrix(true);
        setStatusMessage('Loading...');
        setStatusType('normal');
        try {
          const years = parseYearExpression(yearsInput);
          const rosterYear = years[0];
          const teams = await resolveTeams(sourceInput, rosterYear);

          const rows = [];
          for (const team of teams) {
            for (const yr of years) {
              const ev = (await fetchTBA(`/team/frc${team.num}/events/${yr}`)) || [];
              ev.sort((a, b) => (a.start_date || '').localeCompare(b.start_date || ''));

              const wk = Array.from({ length: 8 }, () => []);
              let worlds = '';
              const off = [];
              let lastEventKey = '';

              for (const e of ev) {
                lastEventKey = e.key;
                const oprData = await fetchTBA(`/event/${e.key}/oprs`).catch(() => ({}));
                const opr = oprData?.oprs?.[`frc${team.num}`] ?? oprData?.oprs?.[team.num];
                const roundedOpr = typeof opr === 'number' ? round2(opr) : '';

                if (roundedOpr !== '') {
                  if (e.event_type >= 0 && e.event_type <= 2) {
                    const w = e.week != null ? e.week : 0;
                    if (w >= 0 && w < 8) wk[w].push(roundedOpr);
                  } else if (e.event_type === 3 || e.event_type === 4) {
                    worlds = roundedOpr;
                  } else {
                    off.push(roundedOpr);
                  }
                }
              }

              let epa = '';
              try {
                const epaRes = await fetchEpaWithFallbacks(team.num, yr, lastEventKey);
                epa = epaRes.value;
              } catch (e) {}

              rows.push({
                teamNumber: team.num,
                teamName: team.name,
                year: yr,
                epa: epa !== '' ? epa : '',
                week1: wk[0]?.[wk[0].length - 1] ?? '',
                week2: wk[1]?.[wk[1].length - 1] ?? '',
                week3: wk[2]?.[wk[2].length - 1] ?? '',
                week4: wk[3]?.[wk[3].length - 1] ?? '',
                week5: wk[4]?.[wk[4].length - 1] ?? '',
                week6: wk[5]?.[wk[5].length - 1] ?? '',
                week7: wk[6]?.[wk[6].length - 1] ?? '',
                worlds,
                off1: off[0] ?? '',
                off2: off[1] ?? '',
                off3: off[2] ?? '',
                off4: off[3] ?? '',
                off5: off[4] ?? '',
              });
            }
          }

          setMatrixRows(rows);
          setStatusMessage(`Loaded data for ${teams.length} teams across ${years.length} year(s).`);
          setStatusType('ok');
        } catch (err) {
          setStatusMessage(err.message || 'Error loading data');
          setStatusType('err');
        } finally {
          setLoadingMatrix(false);
        }
      };

      // Diagnostic Tool
      const handleRunDiagnostics = async () => {
        setShowDebug(true);
        setLoadingDebug(true);
        setDebugOutput('Running connection tests to Statbotics and TBA...\n');
        try {
          const test = await fetchWithTimeout(`${SB_BASE}/team_year/3061/2024`, 4000);
          if (test.ok) {
            const data = await test.json();
            setDebugOutput(`SUCCESS! Direct Statbotics connection working.\nSample EPA data for 3061 (2024):\n${JSON.stringify(data, null, 2)}`);
          } else {
            setDebugOutput(`Statbotics HTTP error: ${test.status}`);
          }
        } catch (err) {
          setDebugOutput(`Statbotics test failed: ${err.message}\nIf blocked by CORS in your browser, try entering your TBA Key above.`);
        } finally {
          setLoadingDebug(false);
        }
      };

      // Copy Table
      const handleCopyTable = () => {
        if (!matrixRows.length) return;
        const tsv = [
          HEADERS.join('\t'),
          ...sortedRows.map(r => [
            r.teamNumber, r.year, r.epa,
            r.week1, r.week2, r.week3, r.week4, r.week5, r.week6, r.week7, r.worlds,
            r.off1, r.off2, r.off3, r.off4, r.off5,
          ].join('\t'))
        ].join('\n');

        navigator.clipboard.writeText(tsv).then(() => {
          setStatusMessage('Table copied to clipboard!');
          setStatusType('ok');
        }).catch(() => {
          setStatusMessage('Failed to copy table.');
          setStatusType('err');
        });
      };

      // Sort Matrix
      const handleSort = (colIdx) => {
        if (sortCol === colIdx) {
          setSortAsc(!sortAsc);
        } else {
          setSortCol(colIdx);
          setSortAsc(false); // Default descending
        }
      };

      const sortedRows = useMemo(() => {
        const copy = [...matrixRows];
        const keys = [
          'teamNumber', 'year', 'epa',
          'week1', 'week2', 'week3', 'week4', 'week5', 'week6', 'week7', 'worlds',
          'off1', 'off2', 'off3', 'off4', 'off5'
        ];
        const key = keys[sortCol] || 'epa';

        copy.sort((a, b) => {
          let va = a[key];
          let vb = b[key];
          if (va === '' || va == null) va = -999999;
          if (vb === '' || vb == null) vb = -999999;
          if (typeof va === 'number' && typeof vb === 'number') {
            return sortAsc ? va - vb : vb - va;
          }
          return sortAsc ? String(va).localeCompare(String(vb)) : String(vb).localeCompare(String(va));
        });
        return copy;
      }, [matrixRows, sortCol, sortAsc]);

      // Tab 2: Show Match Videos
      const handleShowMatchVideos = async () => {
        const teamNum = parseInt(vTeam.replace(/\D/g, ''), 10);
        if (isNaN(teamNum) || teamNum <= 0) {
          setVStatus('Please enter a team number in the input box above.');
          setVStatusType('err');
          return;
        }

        const years = parseYearExpression(vYears);
        if (!years.length) {
          setVStatus('Please enter at least one year.');
          setVStatusType('err');
          return;
        }

        setLoadingVideos(true);
        setVStatus(`Finding match videos for team ${teamNum}...`);
        setVStatusType('normal');
        setVideoMatches([]);

        try {
          const allMatches = [];
          for (const yr of years) {
            const evs = (await fetchTBA(`/team/frc${teamNum}/events/${yr}/simple`)) || [];
            const evMap = {};
            evs.forEach(e => { evMap[e.key] = e; });

            const matches = (await fetchTBA(`/team/frc${teamNum}/matches/${yr}`)) || [];
            for (const m of matches) {
              const videos = (m.videos || []).filter(v => v.type === 'youtube');
              if (vOnlyVideo && !videos.length) continue;

              const isRed = (m.alliances?.red?.team_keys || []).includes(`frc${teamNum}`);
              const alliance = isRed ? 'red' : 'blue';
              const oppAlliance = isRed ? 'blue' : 'red';
              const myScore = m.alliances?.[alliance]?.score ?? -1;
              const oppScore = m.alliances?.[oppAlliance]?.score ?? -1;

              let result = '';
              if (myScore >= 0 && oppScore >= 0) {
                result = myScore > oppScore ? 'Win' : myScore < oppScore ? 'Loss' : 'Tie';
              }

              // Telemetry & Ground-Truth calibration
              const teamKeys = m.alliances?.[alliance]?.team_keys || [];
              const slotIdx = teamKeys.indexOf(`frc${teamNum}`);
              const slot = slotIdx !== -1 ? slotIdx + 1 : 1;
              const sb = m.score_breakdown?.[alliance];

              const stationName = `${alliance.toUpperCase()} ${slot}`;
              let stationBarcode = stationName;
              if (yr === 2024) {
                const labels = ['Amp-Side Wing / Subwoofer Left', 'Center Subwoofer', 'Source-Side Wing / Subwoofer Right'];
                stationBarcode = `${stationName} (${labels[slot - 1] || 'Subwoofer Zone'})`;
              } else if (yr === 2025) {
                const labels = ['Barge / Left Station', 'Center Station', 'Processor / Right Station'];
                stationBarcode = `${stationName} (${labels[slot - 1] || 'Wall Station'})`;
              }

              let autoLeave = 'Unknown';
              let endgame = 'Unknown';
              if (sb) {
                const al = sb[`autoLineRobot${slot}`] ?? sb[`autoMobilityRobot${slot}`] ?? sb[`mobilityRobot${slot}`];
                if (al != null) autoLeave = al === 'Yes' || al === 1 ? 'Yes' : 'No';
                const eg = sb[`endGameRobot${slot}`] ?? sb[`endgameRobot${slot}`];
                if (eg != null) endgame = String(eg);
              }

              const partners = teamKeys.filter(k => k !== `frc${teamNum}`).map(k => k.replace('frc', '')).join(', ');
              const opponents = (m.alliances?.[oppAlliance]?.team_keys || []).map(k => k.replace('frc', '')).join(', ');

              const telemetry = {
                station: stationName,
                stationSlot: slot,
                stationBarcode,
                partners: partners ? `Teams ${partners}` : 'None',
                opponents: opponents ? `Teams ${opponents}` : 'None',
                autoLeave,
                endgame,
                autoPoints: sb?.autoPoints ?? null,
                teleopPoints: sb?.teleopPoints ?? null,
                endgamePoints: sb?.endGamePoints ?? sb?.endgamePoints ?? null,
                totalPoints: myScore >= 0 ? myScore : null,
              };

              allMatches.push({
                matchKey: m.key,
                year: yr,
                eventName: evMap[m.event_key]?.name || m.event_key,
                label: m.comp_level?.toUpperCase() + (m.match_number ? ` Match ${m.match_number}` : ''),
                matchNumber: m.match_number || 0,
                alliance,
                score: myScore >= 0 ? `${myScore} - ${oppScore}` : 'N/A',
                result,
                videoUrl: videos.length ? `https://www.youtube.com/watch?v=${videos[0].key}` : '',
                telemetry,
              });
            }
          }

          allMatches.sort((a, b) => {
            if (a.year !== b.year) return b.year - a.year;
            return a.matchNumber - b.matchNumber;
          });

          setVideoMatches(allMatches);
          setVStatus(`Found ${allMatches.length} matches with video.`);
          setVStatusType('ok');
        } catch (err) {
          setVStatus(err.message || 'Error loading match videos');
          setVStatusType('err');
        } finally {
          setLoadingVideos(false);
        }
      };

      // Tab 2: Run AI Analysis via Supabase Edge Function
      const handleAnalyzeVideo = async (m) => {
        if (!m.videoUrl) {
          setVStatus('No YouTube video available for this match.');
          setVStatusType('err');
          return;
        }

        const teamNum = parseInt(vTeam.replace(/\D/g, ''), 10);
        if (isNaN(teamNum) || teamNum <= 0) {
          setVStatus('Please enter a valid team number in the input box above.');
          setVStatusType('err');
          return;
        }

        setAnalyzingKey(m.matchKey);
        setVStatus(`Analyzing ${m.label} with AI (Ground-truth barcode: ${m.telemetry?.stationBarcode || m.alliance})...`);
        setVStatusType('normal');

        const clip = clipTimes[m.matchKey] || { start: '', end: '' };
        const payload = {
          videoUrl: m.videoUrl,
          teamNumber: teamNum,
          teamName: `Team ${teamNum}`,
          eventName: m.eventName,
          matchLabel: m.label,
          alliance: m.alliance,
          score: m.score,
          year: String(m.year),
          clipStart: clip.start || undefined,
          clipEnd: clip.end || undefined,
          telemetry: m.telemetry,
        };

        try {
          const res = await fetch(functionUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });

          if (!res.ok) {
            const errBody = await res.text();
            throw new Error(`Edge function failed (${res.status}): ${errBody}`);
          }

          const resData = await res.json();
          const analysis = resData.data || resData;

          const report = {
            id: `${m.matchKey}_${Date.now()}`,
            matchKey: m.matchKey,
            teamNumber: teamNum,
            year: m.year,
            eventName: m.eventName,
            matchLabel: m.label,
            analyzedAt: new Date().toLocaleString(),
            videoUrl: m.videoUrl,
            telemetry: m.telemetry,
            ...analysis,
          };

          setAnalysisResults(prev => ({ ...prev, [m.matchKey]: report }));
          setSavedReports(prev => [report, ...prev.filter(r => r.matchKey !== m.matchKey)]);
          setActiveAnalysisView(report);
          setVStatus(`Analysis complete for ${m.label}!`);
          setVStatusType('ok');
        } catch (err) {
          setVStatus(`Analysis error: ${err.message}`);
          setVStatusType('err');
        } finally {
          setAnalyzingKey(null);
        }
      };

      const handleDeleteReport = (id) => {
        setSavedReports(prev => prev.filter(r => r.id !== id));
      };

      return (
        <div>
          <h2 style={{ margin: '0 0 12px 0', fontSize: '22px' }}>FRC Scouting & AI Video Analyzer</h2>

          {/* Navigation Tabs */}
          <div className="tabs">
            <button
              className={`tab-btn ${activeTab === 'data' ? 'active' : ''}`}
              onClick={() => setActiveTab('data')}
            >
              Event OPR / EPA Data
            </button>
            <button
              className={`tab-btn ${activeTab === 'analyze' ? 'active' : ''}`}
              onClick={() => setActiveTab('analyze')}
            >
              Match Videos & AI Video Analyzing
            </button>
            <button
              className={`tab-btn ${activeTab === 'reports' ? 'active' : ''}`}
              onClick={() => setActiveTab('reports')}
            >
              Saved AI Reports ({savedReports.length})
            </button>
          </div>

          {/* Supabase URL Config Accordion */}
          <div style={{ marginBottom: '14px', fontSize: '12px', color: '#555' }}>
            <details>
              <summary style={{ cursor: 'pointer', fontWeight: 'bold' }}>Edge Function & API Settings</summary>
              <div style={{ padding: '8px', background: '#f9f9f9', border: '1px solid #ddd', borderRadius: '4px', marginTop: '4px' }}>
                <div style={{ marginBottom: '6px' }}>
                  <label style={{ display: 'inline-block', width: '150px' }}>Supabase Function URL:</label>
                  <input
                    className="input-txt"
                    style={{ width: '420px' }}
                    value={functionUrl}
                    onChange={(e) => setFunctionUrl(e.target.value)}
                  />
                </div>
                <div>
                  <label style={{ display: 'inline-block', width: '150px' }}>The Blue Alliance Key:</label>
                  <input
                    className="input-txt"
                    style={{ width: '420px' }}
                    placeholder="TBA API key"
                    value={tbaKey}
                    onChange={(e) => setTbaKey(e.target.value)}
                  />
                </div>
              </div>
            </details>
          </div>

          {/* ================= TAB 1: DATA MATRIX ================= */}
          {activeTab === 'data' && (
            <div>
              <div style={{ marginBottom: '8px', display: 'flex', flexWrap: 'wrap', gap: '6px', alignItems: 'center' }}>
                <input
                  id="src"
                  className="input-txt"
                  placeholder="Event name, event link, event key, or team number(s)"
                  value={sourceInput}
                  onChange={(e) => setSourceInput(e.target.value)}
                  style={{ width: '460px' }}
                />
                <input
                  id="years"
                  className="input-txt"
                  placeholder="Year(s)"
                  value={yearsInput}
                  onChange={(e) => setYearsInput(e.target.value)}
                  style={{ width: '160px' }}
                />
                <button
                  id="go"
                  className="btn"
                  onClick={handleLoadData}
                  disabled={loadingMatrix}
                >
                  {loadingMatrix ? 'Loading...' : 'Go'}
                </button>
                <button
                  className="btn"
                  onClick={handleCopyTable}
                  disabled={!matrixRows.length}
                >
                  Copy table
                </button>
                <button
                  className="btn"
                  onClick={handleRunDiagnostics}
                  disabled={loadingDebug}
                  style={{ fontSize: '11px' }}
                >
                  Debug EPA
                </button>
              </div>

              {statusMessage && (
                <div id="status" style={{ margin: '8px 0', fontSize: '13px' }} className={`status-${statusType}`}>
                  {statusMessage}
                </div>
              )}

              {showDebug && (
                <div className="card" style={{ whiteSpace: 'pre-wrap', fontFamily: 'monospace', fontSize: '11px' }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '6px' }}>
                    <strong>Statbotics Diagnostic Output:</strong>
                    <button className="btn" style={{ fontSize: '10px', padding: '2px 6px' }} onClick={() => setShowDebug(false)}>Close</button>
                  </div>
                  {debugOutput}
                </div>
              )}

              {matrixRows.length > 0 && (
                <div style={{ overflowX: 'auto' }}>
                  <table>
                    <thead>
                      <tr>
                        {HEADERS.map((h, i) => (
                          <th key={h} onClick={() => handleSort(i)}>
                            {h} {sortCol === i ? (sortAsc ? '▲' : '▼') : ''}
                          </th>
                        ))}
                      </tr>
                    </thead>
                    <tbody>
                      {sortedRows.map((r, idx) => (
                        <tr key={`${r.teamNumber}_${r.year}_${idx}`}>
                          <td><strong>{r.teamNumber}</strong> {r.teamName ? `(${r.teamName})` : ''}</td>
                          <td>{r.year}</td>
                          <td style={{ fontWeight: 'bold', color: '#1a56db' }}>{r.epa}</td>
                          <td>{r.week1}</td>
                          <td>{r.week2}</td>
                          <td>{r.week3}</td>
                          <td>{r.week4}</td>
                          <td>{r.week5}</td>
                          <td>{r.week6}</td>
                          <td>{r.week7}</td>
                          <td>{r.worlds}</td>
                          <td>{r.off1}</td>
                          <td>{r.off2}</td>
                          <td>{r.off3}</td>
                          <td>{r.off4}</td>
                          <td>{r.off5}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}
            </div>
          )}

          {/* ================= TAB 2: VIDEO ANALYZING ================= */}
          {activeTab === 'analyze' && (
            <div>
              <h3 style={{ margin: '0 0 10px 0', fontSize: '18px', fontWeight: 'bold' }}>
                Match videos & Video Analyzing
              </h3>

              <div style={{ display: 'flex', flexWrap: 'wrap', gap: '8px', alignItems: 'center', marginBottom: '8px' }}>
                <input
                  id="vteam"
                  className="input-txt"
                  placeholder="Team number"
                  value={vTeam}
                  onChange={(e) => setVTeam(e.target.value)}
                  style={{ width: '180px' }}
                />
                <input
                  id="vyears"
                  className="input-txt"
                  placeholder="Year(s)"
                  value={vYears}
                  onChange={(e) => setVYears(e.target.value)}
                  style={{ width: '220px' }}
                />
                <label style={{ fontSize: '13px', cursor: 'pointer', display: 'flex', alignItems: 'center', gap: '4px' }}>
                  <input
                    type="checkbox"
                    id="vonly"
                    checked={vOnlyVideo}
                    onChange={(e) => setVOnlyVideo(e.target.checked)}
                  />
                  Only matches that have a video
                </label>
                <button
                  id="vgo"
                  className="btn"
                  onClick={handleShowMatchVideos}
                  disabled={loadingVideos}
                  style={{ fontWeight: '600' }}
                >
                  {loadingVideos ? 'Loading...' : 'Show match videos'}
                </button>
              </div>

              {vStatus && (
                <div id="vstatus" style={{ margin: '6px 0', fontSize: '13px' }} className={`status-${vStatusType}`}>
                  {vStatus}
                </div>
              )}

              {/* Active Report View Modal / Card */}
              {activeAnalysisView && (
                <div className="card" style={{ borderColor: '#2563eb', background: '#eff6ff', marginBottom: '16px' }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '8px' }}>
                    <h4 style={{ margin: 0, color: '#1e40af', fontSize: '16px' }}>
                      Scouting Report: Team {activeAnalysisView.teamNumber} ({activeAnalysisView.matchLabel})
                    </h4>
                    <button className="btn" style={{ fontSize: '11px' }} onClick={() => setActiveAnalysisView(null)}>
                      Close Details
                    </button>
                  </div>

                  <p style={{ margin: '6px 0', fontSize: '13px', lineHeight: '1.4' }}>
                    <strong>Summary:</strong> {activeAnalysisView.summary}
                  </p>

                  <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', gap: '8px', margin: '10px 0' }}>
                    <div style={{ background: '#fff', padding: '8px', borderRadius: '4px', border: '1px solid #bfdbfe' }}>
                      <strong>Autonomous ({activeAnalysisView.auto?.rating || 8}/10)</strong>
                      <div style={{ fontSize: '12px', marginTop: '4px' }}>{activeAnalysisView.auto?.description}</div>
                    </div>
                    <div style={{ background: '#fff', padding: '8px', borderRadius: '4px', border: '1px solid #bfdbfe' }}>
                      <strong>Teleop Cycling ({activeAnalysisView.teleop?.rating || 8}/10)</strong>
                      <div style={{ fontSize: '12px', marginTop: '4px' }}>{activeAnalysisView.teleop?.description}</div>
                    </div>
                    <div style={{ background: '#fff', padding: '8px', borderRadius: '4px', border: '1px solid #bfdbfe' }}>
                      <strong>Endgame ({activeAnalysisView.endgame?.rating || 8}/10)</strong>
                      <div style={{ fontSize: '12px', marginTop: '4px' }}>{activeAnalysisView.endgame?.description}</div>
                    </div>
                  </div>

                  <div style={{ fontSize: '13px', margin: '8px 0' }}>
                    <strong>Strategic Alliance Pick Verdict:</strong> {activeAnalysisView.alliancePickRecommendation || activeAnalysisView.allianceSelectionVerdict || 'Viable selection'}
                  </div>

                  {activeAnalysisView.telemetry && (
                    <div style={{ fontSize: '11px', color: '#475569', marginTop: '6px', borderTop: '1px solid #bfdbfe', paddingTop: '6px' }}>
                      <strong>Ground-Truth Barcode Anchor:</strong> {activeAnalysisView.telemetry.stationBarcode} | Auto mobility: {activeAnalysisView.telemetry.autoLeave} | Endgame: {activeAnalysisView.telemetry.endgame}
                    </div>
                  )}
                </div>
              )}

              {/* Match List */}
              {videoMatches.length > 0 && (
                <div>
                  <h4 style={{ margin: '12px 0 6px 0', fontSize: '14px' }}>
                    Matches for Team {vTeam} ({videoMatches.length})
                  </h4>
                  <table style={{ fontSize: '12px' }}>
                    <thead>
                      <tr>
                        <th>Year</th>
                        <th>Event</th>
                        <th>Match</th>
                        <th>Alliance</th>
                        <th>Starting Barcode (Calibration)</th>
                        <th>Score</th>
                        <th>Result</th>
                        <th>Video & Clip (sec)</th>
                        <th>Action</th>
                      </tr>
                    </thead>
                    <tbody>
                      {videoMatches.map((m) => {
                        const clip = clipTimes[m.matchKey] || { start: '', end: '' };
                        const hasReport = !!analysisResults[m.matchKey];
                        const isAnalyzing = analyzingKey === m.matchKey;

                        return (
                          <tr key={m.matchKey}>
                            <td>{m.year}</td>
                            <td>{m.eventName}</td>
                            <td><strong>{m.label}</strong></td>
                            <td style={{ color: m.alliance === 'red' ? '#dc2626' : '#2563eb', fontWeight: 'bold' }}>
                              {m.alliance.toUpperCase()}
                            </td>
                            <td style={{ fontSize: '11px', color: '#475569' }}>
                              {m.telemetry?.stationBarcode || 'Unknown'}
                            </td>
                            <td>{m.score}</td>
                            <td style={{ fontWeight: 'bold', color: m.result === 'Win' ? '#16a34a' : m.result === 'Loss' ? '#dc2626' : '#475569' }}>
                              {m.result}
                            </td>
                            <td>
                              {m.videoUrl ? (
                                <div style={{ display: 'flex', alignItems: 'center', gap: '4px' }}>
                                  <a href={m.videoUrl} target="_blank" rel="noopener noreferrer" style={{ color: '#2563eb', textDecoration: 'underline' }}>
                                    Watch
                                  </a>
                                  <input
                                    placeholder="start"
                                    className="input-txt"
                                    style={{ width: '45px', padding: '1px 3px', fontSize: '11px' }}
                                    value={clip.start}
                                    onChange={(e) => setClipTimes(prev => ({ ...prev, [m.matchKey]: { ...clip, start: e.target.value } }))}
                                  />
                                  <input
                                    placeholder="end"
                                    className="input-txt"
                                    style={{ width: '45px', padding: '1px 3px', fontSize: '11px' }}
                                    value={clip.end}
                                    onChange={(e) => setClipTimes(prev => ({ ...prev, [m.matchKey]: { ...clip, end: e.target.value } }))}
                                  />
                                </div>
                              ) : (
                                <span style={{ color: '#999' }}>No video</span>
                              )}
                            </td>
                            <td>
                              {hasReport ? (
                                <button
                                  className="btn"
                                  style={{ padding: '2px 8px', fontSize: '11px', background: '#dbeafe', color: '#1e40af' }}
                                  onClick={() => setActiveAnalysisView(analysisResults[m.matchKey])}
                                >
                                  View Notes
                                </button>
                              ) : (
                                <button
                                  className="btn"
                                  style={{ padding: '2px 8px', fontSize: '11px', fontWeight: 'bold' }}
                                  onClick={() => handleAnalyzeVideo(m)}
                                  disabled={!m.videoUrl || isAnalyzing}
                                >
                                  {isAnalyzing ? 'Analyzing...' : 'Analyze with AI'}
                                </button>
                              )}
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              )}
            </div>
          )}

          {/* ================= TAB 3: SAVED REPORTS ================= */}
          {activeTab === 'reports' && (
            <div>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '10px' }}>
                <h3 style={{ margin: 0, fontSize: '18px', fontWeight: 'bold' }}>
                  Saved AI Scouting Reports ({savedReports.length})
                </h3>
                {savedReports.length > 0 && (
                  <button
                    className="btn"
                    style={{ color: '#dc2626' }}
                    onClick={() => {
                      if (confirm('Clear all saved scouting reports?')) setSavedReports([]);
                    }}
                  >
                    Clear All Reports
                  </button>
                )}
              </div>

              {!savedReports.length ? (
                <div style={{ color: '#666', fontStyle: 'italic', padding: '16px 0' }}>
                  No saved reports yet. Analyze any match in the Match Videos tab to save tactical notes here automatically.
                </div>
              ) : (
                <div style={{ display: 'flex', flexDirection: 'column', gap: '10px' }}>
                  {savedReports.map((rep) => (
                    <div key={rep.id} className="card" style={{ margin: 0 }}>
                      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: '6px' }}>
                        <div>
                          <strong style={{ fontSize: '15px' }}>Team {rep.teamNumber}</strong> — {rep.eventName} ({rep.matchLabel})
                          <span style={{ fontSize: '11px', color: '#666', marginLeft: '8px' }}>{rep.analyzedAt}</span>
                        </div>
                        <div style={{ display: 'flex', gap: '6px' }}>
                          {rep.videoUrl && (
                            <a
                              href={rep.videoUrl}
                              target="_blank"
                              rel="noopener noreferrer"
                              className="btn"
                              style={{ padding: '2px 8px', fontSize: '11px', textDecoration: 'none' }}
                            >
                              Open Video
                            </a>
                          )}
                          <button
                            className="btn"
                            style={{ padding: '2px 8px', fontSize: '11px', color: '#dc2626' }}
                            onClick={() => handleDeleteReport(rep.id)}
                          >
                            Delete
                          </button>
                        </div>
                      </div>
                      <div style={{ fontSize: '13px', lineHeight: '1.5' }}>
                        <p style={{ margin: '4px 0' }}>{rep.summary}</p>
                        <div style={{ fontSize: '12px', color: '#555', marginTop: '6px' }}>
                          Auto ({rep.auto?.rating || 8}/10): {rep.auto?.description}
                        </div>
                        <div style={{ fontSize: '12px', color: '#555', marginTop: '4px' }}>
                          Teleop ({rep.teleop?.rating || 8}/10): {rep.teleop?.description}
                        </div>
                        <div style={{ fontSize: '12px', color: '#555', marginTop: '4px' }}>
                          Endgame ({rep.endgame?.rating || 8}/10): {rep.endgame?.description}
                        </div>
                        <div style={{ fontSize: '12px', fontWeight: 'bold', color: '#1e3a8a', marginTop: '6px' }}>
                          Verdict: {rep.alliancePickRecommendation || rep.allianceSelectionVerdict || 'Viable selection'}
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
