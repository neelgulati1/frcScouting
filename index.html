<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>SHOUT Scouting</title>
<style>
body{font-family:sans-serif;margin:16px}
table{border-collapse:collapse;margin-top:10px}
td,th{border:1px solid #ccc;padding:4px 8px;text-align:right}
td:first-child,th:first-child{text-align:left}
th{cursor:pointer;background:#eee}
</style></head>
<body>
<h2>SHOUT Pre-scouting</h2>
<input id="key" placeholder="TBA API key" size="40">
<button id="go">Load data</button>
<input id="q" placeholder="Search team..." oninput="render()">
<button id="copy">Copy for Sheets</button>
<div id="status"></div>
<table id="t"></table>
<script>
const YEAR=2026, SHOUT="2026wimil", RULE="max"; // "max", "latest" or "mean"
const TEAMS={930:"Mukwonago BEARs",1091:"Oriole Assault",1220:"Rockhoppers - Hilltopper Robotics",1259:"Paradigm Shift",1306:"BadgerBOTS",1675:"UPS (Ultimate Protection Squad)",1714:"MORE Robotics",1732:"Hilltopper Robotics",1739:"Chicago Knights Robotics",1781:"Lindblom Electric Eagles",1792:"Round Table Robotics",2062:"CORE 2062",2151:"PMSA Monty Pythons",2194:"Fondy Fire",2202:"BEAST Robotics",2358:"Bearbotics",2704:"Roaring Robotics",3061:"Huskie Robotics",3596:"Rocket Robotics",3602:"RoboMos",4143:"MARS/WARS",4786:"Nicolet FEAR",5125:"Hawks on the Horizon",6381:"Red Raider Robotics",6574:"Ferradermis",6643:"Walnuts and Bolts",7619:"illumiBOTi",8701:"GRAFFITI",8847:"Milwaukee Cyber Cheese",9425:"Intra Milwaukee"};
const TBA="https://www.thebluealliance.com/api/v3", SB="https://api.statbotics.io/v3";
const H=["Team","Most Recent EPA","Week 1 OPR","Week 2 OPR","Week 3 OPR","Week 4 OPR","Week 5 OPR","Week 6 OPR","Week 7 OPR","Worlds OPR","Off-season 2","Off-season 3","Off-season 4","Off-season 5","Off-season 6"];
let rows=[], cache={}, sortCol=-1, asc=true;
const $=id=>document.getElementById(id);
const r2=x=>Math.round(x*100)/100;
$("key").value=localStorage.getItem("tbakey")||"";

async function tba(p){
  const r=await fetch(TBA+p,{headers:{"X-TBA-Auth-Key":$("key").value.trim()}});
  if(r.status===401) throw new Error("TBA rejected the key (401)");
  return r.ok?r.json():null;
}
function oprs(k){
  if(!(k in cache)) cache[k]=tba("/event/"+k+"/oprs").then(d=>(d&&d.oprs)||{}).catch(()=>({}));
  return cache[k];
}
async function epa(team){
  try{
    const r=await fetch(`${SB}/team_year/${team}/${YEAR}`);
    if(!r.ok) return "";
    const e=(await r.json()).epa||{};
    let v=e.total_points&&e.total_points.mean;
    if(v==null) v=e.stats&&e.stats.end;
    return v==null?"":r2(v);
  }catch(x){return "";}
}
function combine(a){
  if(!a.length) return "";
  if(RULE==="max") return r2(Math.max(...a));
  if(RULE==="mean") return r2(a.reduce((s,x)=>s+x,0)/a.length);
  return r2(a[a.length-1]);
}
async function one(team){
  const ev=(await tba(`/team/frc${team}/events/${YEAR}`))||[];
  ev.sort((a,b)=>(a.start_date||"").localeCompare(b.start_date||""));
  const today=new Date().toISOString().slice(0,10);
  const wk=Array.from({length:8},()=>[]); let worlds="", off=[];
  for(const e of ev){
    if(e.key===SHOUT||(e.end_date||"9999")>today) continue;
    const o=(await oprs(e.key))["frc"+team];
    if(o==null) continue;
    if(e.event_type===99) off.push(r2(o));
    else if(e.event_type===3) worlds=r2(o);
    else if([0,1,2,5].includes(e.event_type)&&e.week!=null){
      const w=e.week+1; if(w>=1&&w<=7) wk[w].push(o);
    }
  }
  const row=[team+" - "+TEAMS[team], await epa(team)];
  for(let w=1;w<=7;w++) row.push(combine(wk[w]));
  row.push(worlds);
  for(let i=0;i<5;i++) row.push(i<off.length?off[i]:"");
  return row;
}
$("go").onclick=async()=>{
  localStorage.setItem("tbakey",$("key").value.trim());
  rows=[]; cache={};
  const nums=Object.keys(TEAMS).map(Number);
  try{
    for(let i=0;i<nums.length;i+=5){
      $("status").textContent=`Loading ${Math.min(i+5,nums.length)}/${nums.length}...`;
      rows.push(...await Promise.all(nums.slice(i,i+5).map(one)));
    }
    $("status").textContent="Done.";
  }catch(e){ $("status").textContent="Error: "+e.message; }
  render();
};
function render(){
  const q=$("q").value.toLowerCase();
  let v=rows.filter(r=>r[0].toLowerCase().includes(q));
  if(sortCol>=0) v=[...v].sort((a,b)=>{
    const x=a[sortCol], y=b[sortCol];
    if(x===""&&y==="") return 0; if(x==="") return 1; if(y==="") return -1;
    const c=(typeof x==="number")?x-y:String(x).localeCompare(String(y));
    return asc?c:-c;
  });
  $("t").innerHTML="<tr>"+H.map((h,i)=>`<th onclick="sortBy(${i})">${h}</th>`).join("")+"</tr>"
    +v.map(r=>"<tr>"+r.map(c=>`<td>${c}</td>`).join("")+"</tr>").join("");
}
function sortBy(i){ asc=(sortCol===i)?!asc:true; sortCol=i; render(); }
$("copy").onclick=()=>{
  navigator.clipboard.writeText(rows.map(r=>r.slice(1).join("\t")).join("\n"));
  $("status").textContent="Copied. Paste into B2 of your sheet.";
};
</script></body></html>
