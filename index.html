<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>FRC Scouting</title>
<style>
body{font-family:sans-serif;margin:16px}
table{border-collapse:collapse;margin-top:10px}
td,th{border:1px solid #ccc;padding:4px 8px;text-align:right}
td:first-child,th:first-child{text-align:left;user-select:none;-webkit-user-select:none}
th{cursor:pointer;background:#eee}
input{margin:2px 0}
.err{font-weight:bold}
td b.n{margin-right:8px}
</style></head>
<body>
<h2>FRC Scouting</h2>
<div><input id="key" placeholder="TBA API key" size="40"></div>
<div><input id="src" placeholder="Event name, event link, event key, or team number(s), e.g. 3061" size="70">
<input id="years" placeholder="Year(s), e.g. 2016 or 2022-2026" size="26" value="2026">
<button id="go">Load data</button></div>
<button id="copy">Copy data</button>
<button onclick="debugEpa()">Debug EPA</button>
<div id="status"></div>
<pre id="dbg" style="white-space:pre-wrap;font-size:12px"></pre>
<table id="t"></table>

<script>
let RULE="max"; // "max", "latest" or "mean" when a team has 2 events in one week
const TBA="https://www.thebluealliance.com/api/v3", SB="https://api.statbotics.io/v3";
const H=["Team","Most Recent EPA","Week 1 OPR","Week 2 OPR","Week 3 OPR","Week 4 OPR","Week 5 OPR","Week 6 OPR","Week 7 OPR","Worlds OPR","Off-season 2","Off-season 3","Off-season 4","Off-season 5","Off-season 6"];
let rows=[], cache={}, sortCol=-1, asc=true, epaErr="", multiYear=false;
const $=id=>document.getElementById(id);
const r2=x=>Math.round(x*100)/100;
$("key").value=localStorage.getItem("tbakey")||"";

async function tba(p){
  const r=await fetch(TBA+p,{headers:{"X-TBA-Auth-Key":$("key").value.trim()}});
  if(r.status===401) throw new Error("TBA rejected the key (401)");
  return r.ok?r.json():null;
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function oprs(k,endDate){
  if(k in cache) return cache[k];
  const finished=endDate&&Date.now()-new Date(endDate).getTime()>3*86400000;
  let saved=null;
  if(finished){ try{ saved=JSON.parse(localStorage.getItem("opr:"+k)||"null"); }catch(e){} }
  cache[k]=saved?Promise.resolve(saved):tba("/event/"+k+"/oprs").then(d=>{
    const o=(d&&d.oprs)||{};
    if(finished&&Object.keys(o).length){ try{ localStorage.setItem("opr:"+k,JSON.stringify(o)); }catch(e){} }
    return o;
  }).catch(()=>({}));
  return cache[k];
}
async function mapLimit(items,limit,fn){
  const out=new Array(items.length); let next=0;
  async function worker(){ while(next<items.length){ const i=next++; out[i]=await fn(items[i],i); } }
  await Promise.all(Array.from({length:Math.min(limit,items.length)},worker));
  return out;
}
function pickEpa(j){
  if(Array.isArray(j)) j=j[0];
  if(Array.isArray(j&&j.results)) j=j.results[0];
  const e=(j&&j.epa)||{};
  const cands=[
    e.total_points&&e.total_points.mean,
    e.total_points&&e.total_points.value,
    typeof e.total_points==="number"?e.total_points:null,
    e.stats&&e.stats.end,
    e.stats&&e.stats.pre_champs,
    j&&j.epa_end,
    j&&j.epa_mean
  ];
  for(const c of cands) if(typeof c==="number") return r2(c);
  return "";
}
function epaUrls(team,year,evKey){
  const u=[[ "season lookup", `${SB}/team_year/${team}/${year}` ]];           // 1st: original method
  if(evKey) u.push([ "last-event lookup", `${SB}/team_event/${team}/${evKey}` ]); // 2nd: last regular-season event
  u.push([ "team_years lookup", `${SB}/team_years?team=${team}&year=${year}` ]);     // 3rd: backup
  if(evKey) u.push([ "event-list lookup", `${SB}/team_events?event=${evKey}&limit=1000`, "list" ]); // 4th: whole event, pick the team out
  if(evKey) u.push([ "event lookup", `${SB}/event/${evKey}`, "list" ]); // 5th: single-event lookup, search inside it for the team
  return u;
}

// Search any JSON shape for an object that belongs to this team and carries an EPA
function findTeamEntry(root,team){
  const want=String(team);
  const stack=[root];
  while(stack.length){
    const x=stack.pop();
    if(x&&typeof x==="object"){
      if(!Array.isArray(x)){
        const id=x.team??x.team_number??x.team_key??x.number;
        if(id!=null&&String(id).replace("frc","")===want&&pickEpa(x)!=="") return x;
      }
      for(const k in x) stack.push(x[k]);
    }
  }
  return null;
}
let epaFails=0, epaSkip=false;
function fetchT(u,ms=6000){
  const c=new AbortController();
  const t=setTimeout(()=>c.abort(),ms);
  return fetch(u,{signal:c.signal}).finally(()=>clearTimeout(t));
}
const evListCache={};
async function epa(team,year,evKey){
  if(epaSkip) return "";
  const errs=[];
  for(const [label,u,kind] of epaUrls(team,year,evKey)){
    try{
      let j;
      if(kind==="list"){
        if(!(u in evListCache)) evListCache[u]=fetchT(u).then(r=>r.ok?r.json():Promise.reject(new Error("HTTP "+r.status)));
        j=await evListCache[u];
        j=findTeamEntry(j,team);
        if(!j){ errs.push(label+": team not found in response"); continue; }
      }else{
        const r=await fetchT(u);
        if(!r.ok){ errs.push(label+": HTTP "+r.status); continue; }
        j=await r.json();
      }
      const v=pickEpa(j);
      if(v!==""){ epaFails=0; return v; }
      errs.push(label+": no EPA in response");
    }catch(x){
      delete evListCache[u];
      errs.push(label+": "+(String(x.message).startsWith("HTTP")?x.message:"blocked/unreachable"));
    }
  }
  if(++epaFails>=2) epaSkip=true;   // Statbotics is clearly not answering: stop trying for the rest of this load
  epaErr="EPA failed for team "+team+" ("+year+"), all methods failed: "+errs.join("; ")+" (click Debug EPA)"+(epaSkip?" EPA lookups were skipped for the remaining teams to save time.":"");
  return "";
}
async function debugEpa(){
  const team=(($("src").value.match(/\b\d{1,5}\b/)||[3061])[0]);
  const year=parseYears($("years").value)[0]||2026;
  let out="Testing Statbotics for team "+team+", year "+year+"\n";
  let evKey="";
  try{
    const ev=(await tba(`/team/frc${team}/events/${year}/simple`))||[];
    ev.sort((a,b)=>(a.start_date||"").localeCompare(b.start_date||""));
    const today=new Date().toISOString().slice(0,10);
    const real=ev.filter(e=>[0,1,2,3,4,5].includes(e.event_type)&&(e.end_date||"9999")<=today);
    evKey=real.length?real[real.length-1].key:"";
    out+="Last real (non-offseason) event per TBA: "+(evKey||"none found")+"\n";
  }catch(x){ out+="Could not read TBA events: "+x.message+"\n"; }
  for(const [label,u] of epaUrls(team,year,evKey)){
    out+="\n"+label+": "+u+"\n";
    try{
      const r=await fetch(u);
      const t=await r.text();
      out+="HTTP "+r.status+"\n"+t.slice(0,1500)+"\n";
    }catch(x){ out+="Failed: "+x.message+"\n"; }
  }
  $("dbg").textContent=out;
}
function combine(a){
  if(!a.length) return "";
  if(RULE==="max") return r2(Math.max(...a));
  if(RULE==="mean") return r2(a.reduce((s,x)=>s+x,0)/a.length);
  return r2(a[a.length-1]);
}
async function one(t,year){
  const team=t.num;
  const today=new Date().toISOString().slice(0,10);
  const ev=((await tba(`/team/frc${team}/events/${year}`))||[])
    .filter(e=>(e.end_date||"9999")<=today)                 // skip events not finished yet
    .sort((a,b)=>(a.start_date||"").localeCompare(b.start_date||""));
  const real=ev.filter(e=>[0,1,2,3,4,5].includes(e.event_type)); // regular-season events only
  const evKey=real.length?real[real.length-1].key:"";
  const epaP=epa(team,year,evKey);                           // EPA runs while the OPR data loads
  const maps=await Promise.all(ev.map(e=>oprs(e.key,e.end_date)));
  const wk=Array.from({length:8},()=>[]); let worlds="", off=[];
  ev.forEach((e,i)=>{
    const o=maps[i]["frc"+team];
    if(o==null) return;
    if(e.event_type===99) off.push(r2(o));
    else if(e.event_type===3) worlds=r2(o);
    else if([0,1,2,5].includes(e.event_type)&&e.week!=null){
      const w=e.week+1; if(w>=1&&w<=7) wk[w].push(o);
    }
  });
  const row=[team+(t.name?" - "+t.name:"")+(multiYear?" ("+year+")":""), await epaP];
  for(let w=1;w<=7;w++) row.push(combine(wk[w]));
  row.push(worlds);
  for(let i=0;i<5;i++) row.push(i<off.length?off[i]:"");
  return row;
}
// "2026", "2024, 2026", "2022-2026"
function parseYears(txt){
  const out=new Set();
  for(const part of txt.split(/[,\s]+/).filter(Boolean)){
    const m=part.match(/^(\d{4})-(\d{4})$/);
    if(m){ let a=+m[1], b=+m[2]; if(a>b)[a,b]=[b,a]; for(let y=a;y<=b&&y-a<30;y++) out.add(y); }
    else if(/^\d{4}$/.test(part)) out.add(+part);
  }
  return [...out];
}
async function teamsFromEvent(key){
  const teams=await tba(`/event/${key}/teams/simple`);
  if(!teams||!teams.length) throw new Error(`The Blue Alliance has no team list for ${key} (it may not be uploaded yet)`);
  return teams.map(t=>({num:t.team_number,name:t.nickname})).sort((a,b)=>a.num-b.num);
}
// Turn the input box into a list of {num, name}. rosterYear is used when searching by event name.
async function resolveTeams(input,rosterYear){
  input=input.trim();
  if(!input) throw new Error("Enter an event name, event link, or team number(s)");
  // 1. only numbers/commas -> team numbers
  if(/^[\d,\s]+$/.test(input)){
    const nums=[...new Set((input.match(/\d+/g)||[]).map(Number))];
    const out=[];
    for(const n of nums){
      const s=await tba(`/team/frc${n}/simple`);
      out.push({num:n,name:s?s.nickname:""});
    }
    return out;
  }
  // 2. FIRST or TBA link
  let m=input.match(/frc-events\.firstinspires\.org\/(\d{4})\/([A-Za-z0-9]+)/i);
  if(m) return teamsFromEvent(m[1]+m[2].toLowerCase());
  m=input.match(/thebluealliance\.com\/event\/(\d{4}[A-Za-z0-9]+)/i);
  if(m) return teamsFromEvent(m[1].toLowerCase());
  // 3. event key like 2026wimil
  if(/^\d{4}(?=[a-z0-9]*[a-z])[a-z0-9]+$/i.test(input)) return teamsFromEvent(input.toLowerCase());
  // 4. event name search in the roster year
  const evs=(await tba(`/events/${rosterYear}/simple`))||[];
  const words=input.toLowerCase().split(/\s+/);
  const hits=evs.filter(e=>words.every(w=>(e.name+" "+e.key).toLowerCase().includes(w)));
  if(!hits.length) throw new Error(`No ${rosterYear} event found matching "${input}"`);
  let pick=hits.length===1?hits[0]:hits.find(e=>e.name.toLowerCase()===input.toLowerCase());
  if(!pick){
    const list=hits.slice(0,8).map(e=>`${e.name} (${e.key})`).join("; ");
    throw new Error(`${hits.length} events match. Be more specific or type the event key. Matches: ${list}`);
  }
  $("status").textContent="Using event: "+pick.name+" ("+pick.key+")";
  return teamsFromEvent(pick.key);
}
$("go").onclick=async()=>{
  localStorage.setItem("tbakey",$("key").value.trim());
  rows=[]; cache={}; epaErr=""; epaFails=0; epaSkip=false; render();
  try{
    const years=parseYears($("years").value);
    if(!years.length) throw new Error("Enter at least one year, like 2026");
    multiYear=years.length>1;
    $("status").textContent="Finding teams...";
    const teams=await resolveTeams($("src").value,years[0]);
    const tasks=[];
    for(const t of teams) for(const y of years) tasks.push([t,y]);
    let done=0;
    rows=await mapLimit(tasks,6,async([t,y])=>{
      const r=await one(t,y);
      $("status").textContent=`Loading ${++done}/${tasks.length}...`;
      return r;
    });
    $("status").textContent="Done."+(epaErr?" EPA problem: "+epaErr:"");
  }catch(e){ $("status").textContent="Error: "+e.message; }
  render();
};
function render(){
  let v=rows;
  if(sortCol>=0) v=[...v].sort((a,b)=>{
    const x=a[sortCol], y=b[sortCol];
    if(x===""&&y==="") return 0; if(x==="") return 1; if(y==="") return -1;
    const c=(typeof x==="number")?x-y:String(x).localeCompare(String(y));
    return asc?c:-c;
  });
  const cell=(c,i)=>{
    if(i===0){
      const m=String(c).match(/^(\d+)(?: - (.*))?$/);
      return m?`<td><b class="n">${m[1]}</b>${esc(m[2]||"")}</td>`:`<td>${esc(c)}</td>`;
    }
    return `<td${i===1?' class="epa"':""}>${esc(c)}</td>`;
  };
  $("t").innerHTML=rows.length?("<tr>"+H.map((h,i)=>`<th class="${i===sortCol?"sorted "+(asc?"asc":"desc"):""}" onclick="sortBy(${i})">${h}</th>`).join("")+"</tr>"
    +v.map(r=>"<tr>"+r.map(cell).join("")+"</tr>").join("")):"";
}
function sortBy(i){ asc=(sortCol===i)?!asc:true; sortCol=i; render(); }
$("copy").onclick=async()=>{
  if(!rows.length){ $("status").textContent="Nothing to copy yet. Load data first."; return; }
  // one year: data columns only (paste at B2). several years: Year column is included.
  const cut=1;
  const text=rows.map(r=>r.slice(cut).join("\t")).join("\n");
  try{
    await navigator.clipboard.writeText(text);
  }catch(e){
    const ta=document.createElement("textarea");
    ta.value=text; document.body.appendChild(ta); ta.select();
    let ok=false;
    try{ ok=document.execCommand("copy"); }catch(x){}
    document.body.removeChild(ta);
    if(!ok){ $("status").textContent="Copy was blocked by your browser. Select the table and copy it manually."; return; }
  }
  $("status").textContent="Copied! Paste into cell B2 of your sheet.";
};


// When you highlight table cells and copy by hand, leave the Team column out of what gets copied
document.addEventListener("copy",e=>{
  const sel=window.getSelection();
  if(!sel||sel.isCollapsed||!sel.rangeCount) return;
  const lines=[];
  document.querySelectorAll("#t tr").forEach(tr=>{
    const cells=[...tr.children].slice(1).filter(c=>sel.containsNode(c,true));
    if(cells.length) lines.push(cells.map(c=>c.textContent.trim()).join("\t"));
  });
  if(!lines.length) return;
  e.clipboardData.setData("text/plain",lines.join("\n"));
  e.preventDefault();
});

// red text for errors, green when finished
(function(){
  const el=$("status");
  new MutationObserver(()=>{
    const t=el.textContent;
    el.classList.toggle("err",/^Error|problem|failed|No .* found|Nothing to copy|Enter /i.test(t));
    el.classList.toggle("ok",/^Done\.$|^Copied!/.test(t));
  }).observe(el,{childList:true,characterData:true,subtree:true});
})();
</script></body></html>
