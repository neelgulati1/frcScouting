<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>FRC Scouting</title>
<style>
body{font-family:sans-serif;margin:16px}
table{border-collapse:collapse;margin-top:10px}
td,th{border:1px solid #ccc;padding:4px 8px;text-align:right}
td:first-child,th:first-child{text-align:left}
th{cursor:pointer;background:#eee}
input{margin:2px 0}
</style></head>
<body>
<h2>FRC Scouting</h2>
<div><input id="key" placeholder="TBA API key" size="40"></div>
<div>
<input id="src" placeholder="Event name (e.g. SHOUT), event link, event key, or team number(s)" size="70">
<input id="years" placeholder="Year(s), e.g. 2016 or 2022-2026" size="26" value="2026">
<button id="go">Load data</button>
</div>
<button id="copy">Copy data</button>
<button onclick="debugEpa()">Debug EPA</button>
<div id="status"></div>
<pre id="dbg" style="white-space:pre-wrap;font-size:12px"></pre>
<table id="t"></table>

<hr style="margin-top:30px">
<h3>Match videos (one team, separate from the event above)</h3>
<div>
<input id="vteam" placeholder="Team number, e.g. 930" size="22">
<input id="vyears" placeholder="Year(s), e.g. 2026 or 2024-2026" size="30" value="2026">
<label><input type="checkbox" id="vonly" checked> Only matches that have a video</label>
<button id="vgo">Show match videos</button>
</div>
<div id="vstatus"></div>
<table id="vt"></table>

<script>
let RULE="max"; // "max", "latest" or "mean" when a team has 2 events in one week
const TBA="https://www.thebluealliance.com/api/v3", SB="https://api.statbotics.io/v3";
const H=["Team","Year","Most Recent EPA","Week 1 OPR","Week 2 OPR","Week 3 OPR","Week 4 OPR","Week 5 OPR","Week 6 OPR","Week 7 OPR","Worlds OPR","Off-season 2","Off-season 3","Off-season 4","Off-season 5","Off-season 6"];
let rows=[], cache={}, sortCol=-1, asc=true, epaErr="", multiYear=false;
const $=id=>document.getElementById(id);
const r2=x=>Math.round(x*100)/100;
$("key").value=localStorage.getItem("tbakey")||"";

async function tba(p){
  const r=await fetch(TBA+p,{headers:{"X-TBA-Auth-Key":$("key").value.trim()}});
  if(r.status===401) throw new Error("TBA rejected the key (401)");
  return r.ok?r.json():null;
}
function oprs(k){
  if(!(k in cache)) cache[k]=tba("/event/"+k+"/oprs").then(d=>(d&&d.oprs)||{}).catch(()=>({}));
  return cache[k];
}
function pickEpa(j){
  if(Array.isArray(j)) j=j[0];
  if(Array.isArray(j&&j.results)) j=j.results[0];
  const e=(j&&j.epa)||{};
  const cands=[
    e.total_points&&e.total_points.mean,
    e.total_points&&e.total_points.value,
    typeof e.total_points==="number"?e.total_points:null,
    e.stats&&e.stats.end,
    e.stats&&e.stats.pre_champs,
    j&&j.epa_end,
    j&&j.epa_mean
  ];
  for(const c of cands) if(typeof c==="number") return r2(c);
  return "";
}
function epaUrls(team,year){
  return [
    `${SB}/team_year/${team}/${year}`,
    `${SB}/team_years?team=${team}&year=${year}`
  ];
}
async function epa(team,year){
  const errs=[];
  for(const u of epaUrls(team,year)){
    try{
      const r=await fetch(u);
      if(!r.ok){ errs.push("HTTP "+r.status); continue; }
      const v=pickEpa(await r.json());
      if(v!=="") return v;
      errs.push("no EPA field found");
    }catch(x){ errs.push("blocked/unreachable"); }
  }
  epaErr="team "+team+" ("+year+"): "+errs.join(", ")+" (click Debug EPA)";
  return "";
}
async function debugEpa(){
  const team=(($("src").value.match(/\b\d{1,5}\b/)||[930])[0]);
  const year=parseYears($("years").value)[0]||2026;
  let out="Testing Statbotics for team "+team+", year "+year+"\n";
  for(const u of epaUrls(team,year)){
    out+="\n"+u+"\n";
    try{
      const r=await fetch(u);
      const t=await r.text();
      out+="HTTP "+r.status+"\n"+t.slice(0,1500)+"\n";
    }catch(x){ out+="Failed: "+x.message+"\n"; }
  }
  $("dbg").textContent=out;
}
function combine(a){
  if(!a.length) return "";
  if(RULE==="max") return r2(Math.max(...a));
  if(RULE==="mean") return r2(a.reduce((s,x)=>s+x,0)/a.length);
  return r2(a[a.length-1]);
}
async function one(t,year){
  const team=t.num;
  const ev=(await tba(`/team/frc${team}/events/${year}`))||[];
  ev.sort((a,b)=>(a.start_date||"").localeCompare(b.start_date||""));
  const today=new Date().toISOString().slice(0,10);
  const wk=Array.from({length:8},()=>[]); let worlds="", off=[];
  for(const e of ev){
    if((e.end_date||"9999")>today) continue; // skip events not finished yet
    const o=(await oprs(e.key))["frc"+team];
    if(o==null) continue;
    if(e.event_type===99) off.push(r2(o));
    else if(e.event_type===3) worlds=r2(o);
    else if([0,1,2,5].includes(e.event_type)&&e.week!=null){
      const w=e.week+1; if(w>=1&&w<=7) wk[w].push(o);
    }
  }
  const row=[team+(t.name?" - "+t.name:""), year, await epa(team,year)];
  for(let w=1;w<=7;w++) row.push(combine(wk[w]));
  row.push(worlds);
  for(let i=0;i<5;i++) row.push(i<off.length?off[i]:"");
  return row;
}
// "2026", "2024, 2026", "2022-2026"
function parseYears(txt){
  const out=new Set();
  for(const part of txt.split(/[,\s]+/).filter(Boolean)){
    const m=part.match(/^(\d{4})-(\d{4})$/);
    if(m){ let a=+m[1], b=+m[2]; if(a>b)[a,b]=[b,a]; for(let y=a;y<=b&&y-a<30;y++) out.add(y); }
    else if(/^\d{4}$/.test(part)) out.add(+part);
  }
  return [...out];
}
async function teamsFromEvent(key){
  const teams=await tba(`/event/${key}/teams/simple`);
  if(!teams||!teams.length) throw new Error(`The Blue Alliance has no team list for ${key} (it may not be uploaded yet)`);
  return teams.map(t=>({num:t.team_number,name:t.nickname})).sort((a,b)=>a.num-b.num);
}
// Turn the input box into a list of {num, name}. rosterYear is used when searching by event name.
async function resolveTeams(input,rosterYear){
  input=input.trim();
  if(!input) throw new Error("Enter an event name, event link, or team number(s)");
  // 1. only numbers/commas -> team numbers
  if(/^[\d,\s]+$/.test(input)){
    const nums=[...new Set((input.match(/\d+/g)||[]).map(Number))];
    const out=[];
    for(const n of nums){
      const s=await tba(`/team/frc${n}/simple`);
      out.push({num:n,name:s?s.nickname:""});
    }
    return out;
  }
  // 2. FIRST or TBA link
  let m=input.match(/frc-events\.firstinspires\.org\/(\d{4})\/([A-Za-z0-9]+)/i);
  if(m) return teamsFromEvent(m[1]+m[2].toLowerCase());
  m=input.match(/thebluealliance\.com\/event\/(\d{4}[A-Za-z0-9]+)/i);
  if(m) return teamsFromEvent(m[1].toLowerCase());
  // 3. event key like 2026wimil
  if(/^\d{4}(?=[a-z0-9]*[a-z])[a-z0-9]+$/i.test(input)) return teamsFromEvent(input.toLowerCase());
  // 4. event name search in the roster year
  const evs=(await tba(`/events/${rosterYear}/simple`))||[];
  const words=input.toLowerCase().split(/\s+/);
  const hits=evs.filter(e=>words.every(w=>(e.name+" "+e.key).toLowerCase().includes(w)));
  if(!hits.length) throw new Error(`No ${rosterYear} event found matching "${input}"`);
  let pick=hits.length===1?hits[0]:hits.find(e=>e.name.toLowerCase()===input.toLowerCase());
  if(!pick){
    const list=hits.slice(0,8).map(e=>`${e.name} (${e.key})`).join("; ");
    throw new Error(`${hits.length} events match. Be more specific or type the event key. Matches: ${list}`);
  }
  $("status").textContent="Using event: "+pick.name+" ("+pick.key+")";
  return teamsFromEvent(pick.key);
}
$("go").onclick=async()=>{
  localStorage.setItem("tbakey",$("key").value.trim());
  rows=[]; cache={}; epaErr=""; render();
  try{
    const years=parseYears($("years").value);
    if(!years.length) throw new Error("Enter at least one year, like 2026");
    multiYear=years.length>1;
    $("status").textContent="Finding teams...";
    const teams=await resolveTeams($("src").value,years[0]);
    const tasks=[];
    for(const t of teams) for(const y of years) tasks.push([t,y]);
    for(let i=0;i<tasks.length;i+=5){
      $("status").textContent=`Loading ${Math.min(i+5,tasks.length)}/${tasks.length}...`;
      rows.push(...await Promise.all(tasks.slice(i,i+5).map(([t,y])=>one(t,y))));
    }
    $("status").textContent="Done."+(epaErr?" EPA problem: "+epaErr:"");
  }catch(e){ $("status").textContent="Error: "+e.message; }
  render();
};
function render(){
  let v=rows;
  if(sortCol>=0) v=[...v].sort((a,b)=>{
    const x=a[sortCol], y=b[sortCol];
    if(x===""&&y==="") return 0; if(x==="") return 1; if(y==="") return -1;
    const c=(typeof x==="number")?x-y:String(x).localeCompare(String(y));
    return asc?c:-c;
  });
  $("t").innerHTML=rows.length?("<tr>"+H.map((h,i)=>`<th onclick="sortBy(${i})">${h}</th>`).join("")+"</tr>"
    +v.map(r=>"<tr>"+r.map(c=>`<td>${c}</td>`).join("")+"</tr>").join("")):"";
}
function sortBy(i){ asc=(sortCol===i)?!asc:true; sortCol=i; render(); }
$("copy").onclick=async()=>{
  if(!rows.length){ $("status").textContent="Nothing to copy yet. Load data first."; return; }
  // one year: data columns only (paste at B2). several years: Year column is included.
  const cut=multiYear?1:2;
  const text=rows.map(r=>r.slice(cut).join("\t")).join("\n");
  try{
    await navigator.clipboard.writeText(text);
  }catch(e){
    const ta=document.createElement("textarea");
    ta.value=text; document.body.appendChild(ta); ta.select();
    let ok=false;
    try{ ok=document.execCommand("copy"); }catch(x){}
    document.body.removeChild(ta);
    if(!ok){ $("status").textContent="Copy was blocked by your browser. Select the table and copy it manually."; return; }
  }
  $("status").textContent="Copied! Paste into cell B2 of your sheet."+(multiYear?" (Year column is included since you loaded several years.)":"");
};

// ---- Match videos for one team ----
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function matchLabel(m){
  const L={qm:"Qualification",ef:"Eighthfinal",qf:"Quarterfinal",sf:"Semifinal",f:"Final"};
  const n=L[m.comp_level]||m.comp_level;
  return m.comp_level==="qm"?`${n} ${m.match_number}`:`${n} ${m.set_number}-${m.match_number}`;
}
$("vgo").onclick=async()=>{
  localStorage.setItem("tbakey",$("key").value.trim());
  $("vt").innerHTML="";
  const num=($("vteam").value.match(/\d+/)||[])[0];
  const years=parseYears($("vyears").value);
  if(!num){ $("vstatus").textContent="Enter a team number."; return; }
  if(!years.length){ $("vstatus").textContent="Enter at least one year."; return; }
  const onlyVideo=$("vonly").checked;
  const me="frc"+num;
  const out=[];
  try{
    for(const y of years){
      $("vstatus").textContent=`Loading ${y}...`;
      const evs=(await tba(`/team/${me}/events/${y}/simple`))||[];
      const evMap={}; evs.forEach(e=>evMap[e.key]=e);
      const ms=(await tba(`/team/${me}/matches/${y}`))||[];
      for(const m of ms){
        const vids=(m.videos||[]).filter(v=>v.type==="youtube");
        if(onlyVideo&&!vids.length) continue;
        const color=(m.alliances.red.team_keys.includes(me))?"red":"blue";
        const opp=color==="red"?"blue":"red";
        const mine=m.alliances[color].score, theirs=m.alliances[opp].score;
        let result="";
        if(mine>=0&&theirs>=0) result=mine>theirs?"Win":(mine<theirs?"Loss":"Tie");
        const ev=evMap[m.event_key]||{};
        out.push({y, ev:ev.name||m.event_key, start:ev.start_date||"", t:m.time||0,
          label:matchLabel(m), color, score:(mine>=0?mine+" - "+theirs:""), result, vids});
      }
    }
    out.sort((a,b)=>(b.start+("0000000000"+b.t).slice(-10)).localeCompare(a.start+("0000000000"+a.t).slice(-10)));
    if(!out.length){
      $("vstatus").textContent=`No ${onlyVideo?"video ":""}matches found for team ${num} in ${years.join(", ")}.`+(onlyVideo?" Try unchecking the box to see all matches.":"");
      return;
    }
    $("vstatus").textContent=`${out.length} match(es) for team ${num}. Newest first.`;
    $("vt").innerHTML="<tr><th>Year</th><th>Event</th><th>Match</th><th>Alliance</th><th>Score (team - opp.)</th><th>Result</th><th>Video</th></tr>"
      +out.map(r=>`<tr><td>${r.y}</td><td style="text-align:left">${esc(r.ev)}</td><td style="text-align:left">${esc(r.label)}</td><td>${r.color}</td><td>${r.score}</td><td>${r.result}</td><td style="text-align:left">`
        +(r.vids.length?r.vids.map((v,i)=>`<a href="https://www.youtube.com/watch?v=${encodeURIComponent(v.key)}" target="_blank" rel="noopener">Watch${r.vids.length>1?" "+(i+1):""}</a>`).join(" "):"no video")
        +"</td></tr>").join("");
  }catch(e){ $("vstatus").textContent="Error: "+e.message; }
};
</script></body></html>
