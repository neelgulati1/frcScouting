<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FRC Scouting & AI Tactical Video Analyzer</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 16px;
      color: #222;
      background: #fff;
    }
    input, button, select, textarea {
      font-family: inherit;
    }
    table {
      border-collapse: collapse;
      margin-top: 10px;
      width: 100%;
      font-size: 13px;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 4px 8px;
    }
    th {
      background: #eee;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }
    th:hover {
      background: #e2e2e2;
    }
    .tabs {
      border-bottom: 1px solid #ccc;
      margin-bottom: 14px;
      display: flex;
      gap: 4px;
    }
    .tab-btn {
      padding: 6px 16px;
      cursor: pointer;
      border: 1px solid #ccc;
      background: #eee;
      margin-bottom: -1px;
      border-radius: 3px 3px 0 0;
      font-size: 13px;
    }
    .tab-btn.active {
      background: #fff;
      border-bottom: 1px solid #fff;
      font-weight: bold;
    }
    .btn {
      padding: 5px 12px;
      background-color: #f0f0f0;
      border: 1px solid #bbb;
      border-radius: 3px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
    }
    .btn:hover {
      background-color: #e5e5e5;
    }
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .input-txt {
      padding: 4px 8px;
      border: 1px solid #ccc;
      border-radius: 2px;
      font-size: 13px;
    }
    .status-ok { color: #070; }
    .status-err { color: #b00; font-weight: bold; }
    .status-normal { color: #333; }
    .card {
      background: #fafafa;
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 12px;
      margin-top: 10px;
    }
  </style>
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel for running in-browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const DEFAULT_SUPABASE_URL = "https://hiidxcirfnetdaagfsuh.supabase.co/functions/v1/analyze-video";
    const TBA_BASE = "https://www.thebluealliance.com/api/v3";
    const SB_BASE = "https://api.statbotics.io/v3";

    const HEADERS = [
      'Team', 'Year', 'Most Recent EPA',
      'Week 1 OPR', 'Week 2 OPR', 'Week 3 OPR', 'Week 4 OPR',
      'Week 5 OPR', 'Week 6 OPR', 'Week 7 OPR', 'Worlds OPR',
      'Off-season 2', 'Off-season 3', 'Off-season 4', 'Off-season 5', 'Off-season 6',
    ];

    const round2 = (val) => Math.round(val * 100) / 100;

    function parseYearExpression(expr) {
      if (!expr || !expr.trim()) return [new Date().getFullYear()];
      const cleaned = expr.replace(/\s+/g, '');
      const years = new Set();
      for (const part of cleaned.split(',')) {
        if (!part) continue;
        if (part.includes('-')) {
          const [aStr, bStr] = part.split('-');
          const a = parseInt(aStr, 10);
          const b = parseInt(bStr, 10);
          if (!isNaN(a) && !isNaN(b)) {
            const start = Math.min(a, b);
            const end = Math.max(a, b);
            for (let y = start; y <= end; y++) years.add(y);
          }
        } else {
          const y = parseInt(part, 10);
          if (!isNaN(y)) years.add(y);
        }
      }
      const arr = Array.from(years).sort((a, b) => b - a);
      return arr.length ? arr : [new Date().getFullYear()];
    }

    function pickEpaFromPayload(json) {
      if (!json) return '';
      let j = json;
      if (Array.isArray(j)) j = j[0];
      if (Array.isArray(j?.results)) j = j.results[0];
      if (!j) return '';

      const epaObj = j.epa || {};
      const candidates = [
        epaObj.total_points?.mean,
        epaObj.total_points?.value,
        typeof epaObj.total_points === 'number' ? epaObj.total_points : null,
        epaObj.stats?.end,
        epaObj.stats?.pre_champs,
        j.epa_end,
        j.epa_mean,
        j.stats?.epa?.end,
        j.recent_epa,
      ];

      for (const c of candidates) {
        if (typeof c === 'number' && !isNaN(c)) return round2(c);
      }
      return '';
    }

    function findTeamEntryInJson(root, teamNum) {
      const want = String(teamNum);
      const stack = [root];
      while (stack.length) {
        const x = stack.pop();
        if (x && typeof x === 'object') {
          if (!Array.isArray(x)) {
            const id = x.team ?? x.team_number ?? x.team_key ?? x.number;
            if (id != null && String(id).replace(/^frc/i, '') === want && pickEpaFromPayload(x) !== '') {
              return x;
            }
          }
          for (const k of Object.keys(x)) {
            stack.push(x[k]);
          }
        }
      }
      return null;
    }

    async function fetchWithTimeout(url, timeoutMs = 4000) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeoutMs);
      try {
        const res = await fetch(url, { signal: controller.signal });
        clearTimeout(timer);
        return res;
      } catch (err) {
        clearTimeout(timer);
        throw err;
      }
    }

    function App() {
      // Navigation
      const [activeTab, setActiveTab] = useState('data');

      // TBA Key & Supabase URL
      const [tbaKey, setTbaKey] = useState(() => localStorage.getItem('tbakey') || '');
      const [functionUrl, setFunctionUrl] = useState(() => localStorage.getItem('supabase_function_url') || DEFAULT_SUPABASE_URL);

      // Tab 1: Data / Matrix (OPR/EPA untouched)
      const [sourceInput, setSourceInput] = useState('');
      const [yearsInput, setYearsInput] = useState('');
      const [matrixRows, setMatrixRows] = useState([]);
      const [statusMessage, setStatusMessage] = useState('');
      const [statusType, setStatusType] = useState('normal');
      const [loadingMatrix, setLoadingMatrix] = useState(false);
      const [sortCol, setSortCol] = useState(2); // Most Recent EPA
      const [sortAsc, setSortAsc] = useState(false);

      // Debug EPA
      const [showDebug, setShowDebug] = useState(false);
      const [debugOutput, setDebugOutput] = useState('');
      const [loadingDebug, setLoadingDebug] = useState(false);

      // Tab 2: Video Analyzing (blank defaults)
      const [vTeam, setVTeam] = useState('');
      const [vYears, setVYears] = useState('');
      const [vOnlyVideo, setVOnlyVideo] = useState(true);
      const [vStatus, setVStatus] = useState('');
      const [vStatusType, setVStatusType] = useState('normal');
      const [loadingVideos, setLoadingVideos] = useState(false);
      const [videoMatches, setVideoMatches] = useState([]);
      const [clipTimes, setClipTimes] = useState({});
      const [analyzingKey, setAnalyzingKey] = useState(null);
      const [analysisResults, setAnalysisResults] = useState({});
      const [activeAnalysisView, setActiveAnalysisView] = useState(null);

      // Tab 3: Saved Reports
      const [savedReports, setSavedReports] = useState(() => {
        try {
          return JSON.parse(localStorage.getItem('frc_saved_reports') || '[]');
        } catch {
          return [];
        }
      });

      useEffect(() => {
        localStorage.setItem('tbakey', tbaKey.trim());
      }, [tbaKey]);

      useEffect(() => {
        localStorage.setItem('supabase_function_url', functionUrl.trim());
      }, [functionUrl]);

      useEffect(() => {
        localStorage.setItem('frc_saved_reports', JSON.stringify(savedReports));
      }, [savedReports]);

      // TBA Helper
      const fetchTBA = async (endpoint) => {
        const key = tbaKey.trim();
        const headers = key ? { 'X-TBA-Auth-Key': key } : {};
        const res = await fetch(`${TBA_BASE}${endpoint}`, { headers });
        if (res.status === 401) {
          throw new Error('TBA rejected API key (401 Unauthorized)');
        }
        if (!res.ok) {
          if (res.status === 404) return null;
          throw new Error(`TBA error HTTP ${res.status}`);
        }
        return res.json();
      };

      // EPA Fetch with Fallbacks
      const fetchEpaWithFallbacks = async (team, year, lastEventKey) => {
        const candidates = [
          { label: 'season lookup', url: `${SB_BASE}/team_year/${team}/${year}` },
          ...(lastEventKey ? [{ label: 'last-event lookup', url: `${SB_BASE}/team_event/${team}/${lastEventKey}` }] : []),
          { label: 'team_years lookup', url: `${SB_BASE}/team_years?team=${team}&year=${year}` },
          ...(lastEventKey ? [{ label: 'event-list lookup', url: `${SB_BASE}/team_events?event=${lastEventKey}&limit=1000`, isList: true }] : []),
        ];

        for (const { label, url, isList } of candidates) {
          try {
            const response = await fetchWithTimeout(url, 3500);
            if (!response.ok) continue;
            const json = await response.json();
            if (isList) {
              const entry = findTeamEntryInJson(json, team);
              if (entry) {
                const val = pickEpaFromPayload(entry);
                if (val !== '') return { value: val, details: label };
              }
            } else {
              const val = pickEpaFromPayload(json);
              if (val !== '') return { value: val, details: label };
            }
          } catch (err) {}
        }
        return { value: '', details: 'all lookups failed' };
      };

      // Resolve Teams for Tab 1
      const resolveTeams = async (inputStr, rosterYear) => {
        const trimmed = inputStr.trim();
        if (!trimmed) throw new Error('Enter an event name, event link, event key, or team number(s)');

        if (/^[\d,\s]+$/.test(trimmed)) {
          const numbers = Array.from(new Set((trimmed.match(/\d+/g) || []).map(Number)));
          const out = [];
          for (const n of numbers) {
            try {
              const s = await fetchTBA(`/team/frc${n}/simple`);
              out.push({ num: n, name: s ? s.nickname : '' });
            } catch {
              out.push({ num: n, name: '' });
            }
          }
          return out;
        }

        let m = trimmed.match(/frc-events\.firstinspires\.org\/(\d{4})\/([A-Za-z0-9]+)/i);
        if (m) return teamsFromEvent(m[1] + m[2].toLowerCase());
        m = trimmed.match(/thebluealliance\.com\/event\/(\d{4}[A-Za-z0-9]+)/i);
        if (m) return teamsFromEvent(m[1].toLowerCase());

        if (/^\d{4}(?=[a-z0-9]*[a-z])[a-z0-9]+$/i.test(trimmed)) {
          return teamsFromEvent(trimmed.toLowerCase());
        }

        const evs = (await fetchTBA(`/events/${rosterYear}/simple`)) || [];
        const words = trimmed.toLowerCase().split(/\s+/);
        const hits = evs.filter((e) => words.every((w) => `${e.name} ${e.key}`.toLowerCase().includes(w)));
        if (!hits.length) throw new Error(`No ${rosterYear} event found matching "${trimmed}"`);
        let pick = hits.length === 1 ? hits[0] : hits.find((e) => e.name.toLowerCase() === trimmed.toLowerCase());
        if (!pick) pick = hits[0];

        setStatusMessage(`Using event: ${pick.name} (${pick.key})`);
        return teamsFromEvent(pick.key);
      };

      const teamsFromEvent = async (eventKey) => {
        const teams = await fetchTBA(`/event/${eventKey}/teams/simple`);
        if (!teams || !teams.length) throw new Error(`No teams found for event ${eventKey}`);
        return teams.map((t) => ({ num: t.team_number, name: t.nickname || '' })).sort((a, b) => a.num - b.num);
      };

      // Load Tab 1 Matrix
      const handleLoadData = async () => {
        setLoadingMatrix(true);
        setStatusMessage('Loading...');
        setStatusType('normal');
        try {
          const years = parseYearExpression(yearsInput);
          const rosterYear = years[0];
          const teams = await resolveTeams(sourceInput, rosterYear);

          const rows = [];
          for (const team of teams) {
            for (const yr of years) {
              const ev = (await fetchTBA(`/team/frc${team.num}/events/${yr}`)) || [];
              ev.sort((a, b) => (a.start_date || '').localeCompare(b.start_date || ''));

              const wk = Array.from({ length: 8 }, () => []);
              let worlds = '';
              const off = [];
              let lastEventKey = '';

              for (const e of ev) {
                lastEventKey = e.key;
                const oprData = await fetchTBA(`/event/${e.key}/oprs`).catch(() => ({}));
                const opr = oprData?.oprs?.[`frc${team.num}`] ?? oprData?.oprs?.[team.num];
                const roundedOpr = typeof opr === 'number' ? round2(opr) : '';

                if (roundedOpr !== '') {
                  if (e.event_type >= 0 && e.event_type <= 2) {
                    const w = e.week != null ? e.week : 0;
                    if (w >= 0 && w < 8) wk[w].push(roundedOpr);
                  } else if (e.event_type === 3 || e.event_type === 4) {
                    worlds = roundedOpr;
                  } else {
                    off.push(roundedOpr);
                  }
                }
              }

              let epa = '';
              try {
                const epaRes = await fetchEpaWithFallbacks(team.num, yr, lastEventKey);
                epa = epaRes.value;
              } catch (e) {}

              rows.push({
                teamNumber: team.num,
                teamName: team.name,
                year: yr,
                epa: epa !== '' ? epa : '',
                week1: wk[0]?.[wk[0].length - 1] ?? '',
                week2: wk[1]?.[wk[1].length - 1] ?? '',
                week3: wk[2]?.[wk[2].length - 1] ?? '',
                week4: wk[3]?.[wk[3].length - 1] ?? '',
                week5: wk[4]?.[wk[4].length - 1] ?? '',
                week6: wk[5]?.[wk[5].length - 1] ?? '',
                week7: wk[6]?.[wk[6].length - 1] ?? '',
                worlds,
                offseason: off.slice(0, 5),
              });
            }
          }

          setMatrixRows(rows);
          setStatusMessage(`Loaded ${rows.length} rows successfully.`);
          setStatusType('ok');
        } catch (err) {
          setStatusMessage(err.message || 'Error loading data');
          setStatusType('err');
        } finally {
          setLoadingMatrix(false);
        }
      };

      // Copy Tab 1 Matrix
      const handleCopyData = () => {
        if (!matrixRows.length) return;
        const lines = [HEADERS.join('\t')];
        for (const r of matrixRows) {
          const rowData = [
            `${r.teamNumber} ${r.teamName || ''}`.trim(),
            r.year,
            r.epa,
            r.week1, r.week2, r.week3, r.week4, r.week5, r.week6, r.week7,
            r.worlds,
            ...(r.offseason || [])
          ];
          lines.push(rowData.join('\t'));
        }
        navigator.clipboard.writeText(lines.join('\n'));
        setStatusMessage('Table copied to clipboard (TSV format)!');
        setStatusType('ok');
      };

      // Debug EPA
      const handleDebugEpa = async () => {
        setShowDebug(true);
        setLoadingDebug(true);
        setDebugOutput('Testing Statbotics connection...');
        try {
          const test = await fetchWithTimeout(`${SB_BASE}/team_year/3061/2024`, 4000);
          if (test.ok) {
            const data = await test.json();
            setDebugOutput(`SUCCESS! Direct Statbotics connection working.\nSample EPA data for 3061 (2024):\n${JSON.stringify(data, null, 2)}`);
          } else {
            setDebugOutput(`HTTP ${test.status} from Statbotics.`);
          }
        } catch (err) {
          setDebugOutput(`Error testing Statbotics: ${err.message}`);
        } finally {
          setLoadingDebug(false);
        }
      };

      // Tab 2: Show Match Videos (Sorted newest to oldest)
      const handleShowMatchVideos = async () => {
        const teamNum = parseInt(vTeam.trim(), 10);
        if (isNaN(teamNum)) {
          setVStatus('Please enter a valid team number');
          setVStatusType('err');
          return;
        }

        setLoadingVideos(true);
        setVStatus('Loading match videos...');
        setVStatusType('normal');
        setVideoMatches([]);

        try {
          const years = parseYearExpression(vYears);
          const allMatches = [];

          for (const yr of years) {
            const evs = (await fetchTBA(`/team/frc${teamNum}/events/${yr}`)) || [];
            evs.sort((a, b) => (a.start_date || '').localeCompare(b.start_date || ''));

            for (const ev of evs) {
              const mList = (await fetchTBA(`/team/frc${teamNum}/event/${ev.key}/matches`)) || [];
              for (const m of mList) {
                const redKeys = m.alliances?.red?.team_keys || [];
                const blueKeys = m.alliances?.blue?.team_keys || [];
                const myKey = `frc${teamNum}`;
                const isRed = redKeys.includes(myKey);
                const isBlue = blueKeys.includes(myKey);
                if (!isRed && !isBlue) continue;

                const alliance = isRed ? 'red' : 'blue';
                const redScore = m.alliances?.red?.score ?? 0;
                const blueScore = m.alliances?.blue?.score ?? 0;
                const myScore = isRed ? redScore : blueScore;
                const oppScore = isRed ? blueScore : redScore;

                let result = '';
                if (myScore > oppScore) result = 'Win';
                else if (myScore < oppScore) result = 'Loss';
                else if (myScore === oppScore && myScore > 0) result = 'Tie';

                const ytVideo = (m.videos || []).find((v) => v.type === 'youtube');
                const videoUrl = ytVideo ? `https://www.youtube.com/watch?v=${ytVideo.key}` : '';

                if (vOnlyVideo && !videoUrl) continue;

                const slot = isRed ? redKeys.indexOf(myKey) + 1 : blueKeys.indexOf(myKey) + 1;
                const stationName = `${alliance.toUpperCase()} ${slot}`;

                let barcode = stationName;
                if (slot === 1) barcode += ' (Amp Wall / Stage Left)';
                else if (slot === 2) barcode += ' (Subwoofer Center / Middle)';
                else if (slot === 3) barcode += ' (Source Side / Stage Right)';

                const partners = (isRed ? redKeys : blueKeys)
                  .filter((k) => k !== myKey)
                  .map((k) => k.replace('frc', ''))
                  .join(', ');
                const opponents = (isRed ? blueKeys : redKeys)
                  .map((k) => k.replace('frc', ''))
                  .join(', ');

                const breakdown = m.score_breakdown?.[alliance] || {};
                let autoLeave = 'Unknown';
                const autoLine = breakdown[`autoLineRobot${slot}`];
                const autoMobility = breakdown[`autoMobilityRobot${slot}`] || breakdown[`mobilityRobot${slot}`];
                if (autoLine === 'Yes' || autoMobility === 'Yes' || autoMobility === true) {
                  autoLeave = 'Verified Left Starting Line';
                } else if (autoLine === 'No' || autoMobility === 'No' || autoMobility === false) {
                  autoLeave = 'Did NOT Leave Starting Line';
                }

                const endgame = breakdown[`endGameRobot${slot}`] || 'Unknown';

                allMatches.push({
                  year: yr,
                  eventKey: ev.key,
                  eventName: ev.name || ev.key,
                  matchKey: m.key,
                  label: `${m.comp_level.toUpperCase()} ${m.match_number}`,
                  compLevel: m.comp_level,
                  matchNumber: m.match_number,
                  alliance,
                  score: `${myScore} - ${oppScore}`,
                  result,
                  youtubeKey: ytVideo?.key || '',
                  videoUrl,
                  time: m.time || 0,
                  startDate: ev.start_date || '',
                  telemetry: {
                    station: stationName,
                    stationSlot: slot,
                    stationBarcode: barcode,
                    partners,
                    opponents,
                    autoLeave,
                    endgame,
                    autoPoints: breakdown.autoPoints ?? null,
                    teleopPoints: breakdown.teleopPoints ?? null,
                    endgamePoints: breakdown.endGamePoints ?? null,
                    totalPoints: breakdown.totalPoints ?? myScore,
                  }
                });
              }
            }
          }

          // Sort matches from most recent to oldest
          allMatches.sort((a, b) => {
            const timeA = String(a.startDate || '') + String(a.time || 0).padStart(10, '0');
            const timeB = String(b.startDate || '') + String(b.time || 0).padStart(10, '0');
            return timeB.localeCompare(timeA);
          });

          setVideoMatches(allMatches);
          setVStatus(`Found ${allMatches.length} match(es). Most recent to oldest.`);
          setVStatusType('ok');
        } catch (err) {
          setVStatus(err.message || 'Error loading match videos');
          setVStatusType('err');
        } finally {
          setLoadingVideos(false);
        }
      };

      // Tab 2: Run AI Analysis via Supabase Edge Function
      const handleAnalyzeVideo = async (m) => {
        if (!m.videoUrl) {
          setVStatus('No YouTube video available for this match.');
          setVStatusType('err');
          return;
        }

        const teamNum = parseInt(vTeam.replace(/\D/g, ''), 10);
        if (isNaN(teamNum) || teamNum <= 0) {
          setVStatus('Please enter a valid team number in the input box above.');
          setVStatusType('err');
          return;
        }

        setAnalyzingKey(m.matchKey);
        setVStatus(`Analyzing ${m.label} with AI (Ground-truth barcode: ${m.telemetry?.stationBarcode || m.alliance})...`);
        setVStatusType('normal');

        const clip = clipTimes[m.matchKey] || { start: '', end: '' };
        const payload = {
          videoUrl: m.videoUrl,
          teamNumber: teamNum,
          teamName: `Team ${teamNum}`,
          eventName: m.eventName,
          matchLabel: m.label,
          alliance: m.alliance,
          score: m.score,
          year: String(m.year),
          clipStart: clip.start || undefined,
          clipEnd: clip.end || undefined,
          telemetry: m.telemetry,
        };

        try {
          const res = await fetch(functionUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });

          if (!res.ok) {
            const errText = await res.text();
            throw new Error(`Edge function failed (${res.status}): ${errText}`);
          }

          const resData = await res.json();
          const report = resData.data || resData;

          const completeReport = {
            ...report,
            matchKey: m.matchKey,
            teamNumber: parseInt(vTeam.trim(), 10),
            matchLabel: m.label,
            videoUrl: m.videoUrl,
            alliance: m.alliance,
            analyzedAt: new Date().toLocaleString(),
          };

          setAnalysisResults((prev) => ({ ...prev, [m.matchKey]: completeReport }));
          setActiveAnalysisView(m.matchKey);

          // Add to saved reports
          setSavedReports((prev) => {
            const filtered = prev.filter((r) => r.matchKey !== m.matchKey);
            return [completeReport, ...filtered];
          });

          setVStatus(`Analysis complete for ${m.label}!`);
          setVStatusType('ok');
        } catch (err) {
          setVStatus(`Analysis error: ${err.message}`);
          setVStatusType('err');
        } finally {
          setAnalyzingKey(null);
        }
      };

      // Sorting for Tab 1
      const sortedRows = useMemo(() => {
        if (!matrixRows.length) return [];
        return [...matrixRows].sort((a, b) => {
          let valA, valB;
          if (sortCol === 0) {
            valA = a.teamNumber; valB = b.teamNumber;
          } else if (sortCol === 1) {
            valA = a.year; valB = b.year;
          } else if (sortCol === 2) {
            valA = a.epa === '' ? -999 : Number(a.epa);
            valB = b.epa === '' ? -999 : Number(b.epa);
          } else {
            valA = 0; valB = 0;
          }
          if (valA < valB) return sortAsc ? -1 : 1;
          if (valA > valB) return sortAsc ? 1 : -1;
          return 0;
        });
      }, [matrixRows, sortCol, sortAsc]);

      const sortBy = (colIdx) => {
        if (sortCol === colIdx) {
          setSortAsc(!sortAsc);
        } else {
          setSortCol(colIdx);
          setSortAsc(false);
        }
      };

      return (
        <div style={{ maxWidth: '1400px', margin: '0 auto' }}>
          {/* Header */}
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '8px' }}>
            <h2 style={{ margin: 0, fontSize: '24px', fontWeight: 'bold' }}>FRC Scouting</h2>
            <div style={{ fontSize: '12px', color: '#555', display: 'flex', alignItems: 'center', gap: '6px' }}>
              <span>Edge Function:</span>
              <input
                className="input-txt"
                value={functionUrl}
                onChange={(e) => setFunctionUrl(e.target.value)}
                style={{ width: '280px', fontSize: '11px', padding: '2px 6px' }}
                title="Supabase Edge Function endpoint"
              />
            </div>
          </div>

          {/* Navigation Tabs */}
          <div className="tabs">
            <button
              className={`tab-btn ${activeTab === 'data' ? 'active' : ''}`}
              onClick={() => setActiveTab('data')}
            >
              Data
            </button>
            <button
              className={`tab-btn ${activeTab === 'analyze' ? 'active' : ''}`}
              onClick={() => setActiveTab('analyze')}
            >
              Video Analyzing
            </button>
            <button
              className={`tab-btn ${activeTab === 'reports' ? 'active' : ''}`}
              onClick={() => setActiveTab('reports')}
            >
              Saved Reports {savedReports.length > 0 ? `(${savedReports.length})` : ''}
            </button>
          </div>

          {/* ================= TAB 1: DATA ================= */}
          {activeTab === 'data' && (
            <div>
              <div style={{ marginBottom: '8px' }}>
                <input
                  id="key"
                  className="input-txt"
                  placeholder="TBA API key"
                  value={tbaKey}
                  onChange={(e) => setTbaKey(e.target.value)}
                  style={{ width: '340px' }}
                />
                <span style={{ fontSize: '11px', color: '#666', marginLeft: '8px' }}>
                  (saved in your browser)
                </span>
              </div>

              <div style={{ marginBottom: '8px', display: 'flex', flexWrap: 'wrap', gap: '6px', alignItems: 'center' }}>
                <input
                  id="src"
                  className="input-txt"
                  placeholder="Event name, event link, event key, or team number(s)"
                  value={sourceInput}
                  onChange={(e) => setSourceInput(e.target.value)}
                  style={{ width: '460px' }}
                />
                <input
                  id="years"
                  className="input-txt"
                  placeholder="Year(s)"
                  value={yearsInput}
                  onChange={(e) => setYearsInput(e.target.value)}
                  style={{ width: '160px' }}
                />
                <button
                  id="go"
                  className="btn"
                  onClick={handleLoadData}
                  disabled={loadingMatrix}
                  style={{ fontWeight: '600' }}
                >
                  {loadingMatrix ? 'Loading...' : 'Load data'}
                </button>
              </div>

              <div style={{ marginBottom: '8px', display: 'flex', gap: '6px', alignItems: 'center' }}>
                <button id="copy" className="btn" onClick={handleCopyData}>
                  Copy data
                </button>
                <button className="btn" onClick={handleDebugEpa}>
                  Debug EPA
                </button>
              </div>

              {statusMessage && (
                <div id="status" style={{ margin: '8px 0', fontSize: '13px' }} className={`status-${statusType}`}>
                  {statusMessage}
                </div>
              )}

              {showDebug && (
                <div className="card">
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                    <strong>EPA Diagnostic Log:</strong>
                    <button className="btn" style={{ padding: '2px 6px', fontSize: '11px' }} onClick={() => setShowDebug(false)}>
                      Close Log
                    </button>
                  </div>
                  <pre style={{ whiteSpace: 'pre-wrap', fontSize: '12px', background: '#f4f4f4', padding: '8px', marginTop: '6px' }}>
                    {loadingDebug ? 'Testing Statbotics connection...' : debugOutput}
                  </pre>
                </div>
              )}

              <table id="t">
                <thead>
                  <tr>
                    {HEADERS.map((h, i) => (
                      <th
                        key={h}
                        onClick={() => sortBy(i)}
                        style={{
                          textAlign: i === 0 ? 'left' : 'right',
                          backgroundColor: sortCol === i ? '#e2e2e2' : '#eee',
                        }}
                      >
                        {h} {sortCol === i ? (sortAsc ? ' ▲' : ' ▼') : ''}
                      </th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {sortedRows.length === 0 ? (
                    <tr>
                      <td colSpan={HEADERS.length} style={{ textAlign: 'center', color: '#666', padding: '16px' }}>
                        {loadingMatrix ? 'Loading data...' : 'No data loaded yet. Enter event or teams above and click Load data.'}
                      </td>
                    </tr>
                  ) : (
                    sortedRows.map((r, idx) => (
                      <tr key={`${r.teamNumber}-${r.year}-${idx}`}>
                        <td style={{ textAlign: 'left' }}>
                          <b style={{ marginRight: '8px' }}>{r.teamNumber}</b>
                          {r.teamName || ''}
                        </td>
                        <td style={{ textAlign: 'right' }}>{r.year}</td>
                        <td style={{ textAlign: 'right', backgroundColor: '#f5f9ff', fontWeight: r.epa !== '' ? 'bold' : 'normal' }}>
                          {r.epa}
                        </td>
                        <td style={{ textAlign: 'right' }}>{r.week1}</td>
                        <td style={{ textAlign: 'right' }}>{r.week2}</td>
                        <td style={{ textAlign: 'right' }}>{r.week3}</td>
                        <td style={{ textAlign: 'right' }}>{r.week4}</td>
                        <td style={{ textAlign: 'right' }}>{r.week5}</td>
                        <td style={{ textAlign: 'right' }}>{r.week6}</td>
                        <td style={{ textAlign: 'right' }}>{r.week7}</td>
                        <td style={{ textAlign: 'right' }}>{r.worlds}</td>
                        {r.offseason.map((off, oIdx) => (
                          <td key={oIdx} style={{ textAlign: 'right' }}>{off}</td>
                        ))}
                      </tr>
                    ))
                  )}
                </tbody>
              </table>
            </div>
          )}

          {/* ================= TAB 2: VIDEO ANALYZING ================= */}
          {activeTab === 'analyze' && (
            <div>
              <h3 style={{ margin: '0 0 10px 0', fontSize: '18px', fontWeight: 'bold' }}>
                Match videos & Video Analyzing
              </h3>

              <div style={{ display: 'flex', flexWrap: 'wrap', gap: '8px', alignItems: 'center', marginBottom: '8px' }}>
                <input
                  id="vteam"
                  className="input-txt"
                  placeholder="Team number"
                  value={vTeam}
                  onChange={(e) => setVTeam(e.target.value)}
                  style={{ width: '180px' }}
                />
                <input
                  id="vyears"
                  className="input-txt"
                  placeholder="Year(s)"
                  value={vYears}
                  onChange={(e) => setVYears(e.target.value)}
                  style={{ width: '220px' }}
                />
                <label style={{ fontSize: '13px', cursor: 'pointer', display: 'flex', alignItems: 'center', gap: '4px' }}>
                  <input
                    type="checkbox"
                    id="vonly"
                    checked={vOnlyVideo}
                    onChange={(e) => setVOnlyVideo(e.target.checked)}
                  />
                  Only matches that have a video
                </label>
                <button
                  id="vgo"
                  className="btn"
                  onClick={handleShowMatchVideos}
                  disabled={loadingVideos}
                  style={{ fontWeight: '600' }}
                >
                  {loadingVideos ? 'Loading...' : 'Show match videos'}
                </button>
              </div>

              {vStatus && (
                <div id="vstatus" style={{ margin: '6px 0', fontSize: '13px' }} className={`status-${vStatusType}`}>
                  {vStatus}
                </div>
              )}

              {/* Tactical Analysis Result Banner */}
              {activeAnalysisView && analysisResults[activeAnalysisView] && (
                <div className="card" style={{ border: '2px solid #2563eb', background: '#f8fafc', marginBottom: '16px' }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: '8px' }}>
                    <div>
                      <h4 style={{ margin: 0, fontSize: '16px', color: '#1e3a8a' }}>
                        Tactical Report: {analysisResults[activeAnalysisView].matchLabel} — Team {analysisResults[activeAnalysisView].teamNumber}
                      </h4>
                      <div style={{ fontSize: '12px', color: '#475569', marginTop: '3px' }}>
                        Robot Identification: <strong>{analysisResults[activeAnalysisView].robotIdentified ? 'Confirmed' : 'Uncertain'}</strong> | 
                        Bumper: <span style={{ color: analysisResults[activeAnalysisView].alliance === 'red' ? '#dc2626' : '#2563eb', fontWeight: 'bold' }}>{analysisResults[activeAnalysisView].alliance?.toUpperCase()}</span> |
                        Station Barcode: <strong>{analysisResults[activeAnalysisView].startingStation || 'Calibrated'}</strong>
                      </div>
                    </div>
                    <button className="btn" style={{ padding: '2px 8px', fontSize: '12px' }} onClick={() => setActiveAnalysisView(null)}>
                      Close
                    </button>
                  </div>

                  <div style={{ background: '#fff', border: '1px solid #e2e8f0', borderRadius: '4px', padding: '10px', fontSize: '13px', lineHeight: '1.5' }}>
                    <div style={{ marginBottom: '8px' }}>
                      <strong>Executive Summary:</strong> {analysisResults[activeAnalysisView].summary}
                    </div>

                    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(280px, 1fr))', gap: '10px', margin: '10px 0' }}>
                      <div style={{ background: '#f8fafc', padding: '10px', borderRadius: '4px', border: '1px solid #e2e8f0' }}>
                        <strong style={{ color: '#1e3a8a' }}>Auto (Exact Auto):</strong>
                        <div style={{ marginTop: '4px', fontSize: '12px' }}>
                          {analysisResults[activeAnalysisView].auto?.exactAuto || analysisResults[activeAnalysisView].auto?.description}
                        </div>
                        <div style={{ fontSize: '11px', color: '#64748b', marginTop: '4px' }}>
                          Scored: {analysisResults[activeAnalysisView].auto?.cyclesEstimate || 'Observed'} | Execution: {analysisResults[activeAnalysisView].auto?.reliability || 'Observed'}
                        </div>
                      </div>

                      <div style={{ background: '#f8fafc', padding: '10px', borderRadius: '4px', border: '1px solid #e2e8f0' }}>
                        <strong style={{ color: '#1e3a8a' }}>Transition Period (10s post-auto):</strong>
                        <div style={{ marginTop: '4px', fontSize: '12px' }}>
                          {analysisResults[activeAnalysisView].transitionPeriod?.description || 'Active transition to field play.'}
                        </div>
                      </div>

                      <div style={{ background: '#f8fafc', padding: '10px', borderRadius: '4px', border: '1px solid #e2e8f0' }}>
                        <strong style={{ color: '#1e3a8a' }}>Inactive & Active Teleop:</strong>
                        <div style={{ marginTop: '4px', fontSize: '12px' }}>
                          {analysisResults[activeAnalysisView].teleop?.inactiveNotes && (
                            <div style={{ marginBottom: '3px' }}>
                              <strong>Inactive:</strong> {analysisResults[activeAnalysisView].teleop.inactiveNotes}
                            </div>
                          )}
                          {analysisResults[activeAnalysisView].teleop?.activeNotes && (
                            <div>
                              <strong>Active:</strong> {analysisResults[activeAnalysisView].teleop.activeNotes}
                            </div>
                          )}
                          {!analysisResults[activeAnalysisView].teleop?.inactiveNotes && !analysisResults[activeAnalysisView].teleop?.activeNotes && (
                            <div>{analysisResults[activeAnalysisView].teleop?.description}</div>
                          )}
                        </div>
                        <div style={{ fontSize: '11px', color: '#64748b', marginTop: '4px' }}>
                          Speed: {analysisResults[activeAnalysisView].teleop?.cycleSpeed || 'Moderate'} | Intake: {analysisResults[activeAnalysisView].teleop?.intakeReliability || 'Observed'}
                        </div>
                      </div>

                      <div style={{ background: '#f8fafc', padding: '10px', borderRadius: '4px', border: '1px solid #e2e8f0' }}>
                        <strong style={{ color: '#1e3a8a' }}>Endgame & Climb:</strong>
                        <div style={{ marginTop: '4px', fontSize: '12px' }}>
                          {analysisResults[activeAnalysisView].endgame?.description}
                        </div>
                        <div style={{ fontSize: '11px', color: '#64748b', marginTop: '4px' }}>
                          Climb: {analysisResults[activeAnalysisView].endgame?.climbType || analysisResults[activeAnalysisView].endgame?.climbLevel || 'Observed'} | Time: {analysisResults[activeAnalysisView].endgame?.timeRemainingSeconds || analysisResults[activeAnalysisView].endgame?.climbTimeSeconds || 'N/A'}s
                        </div>
                      </div>
                    </div>

                    {/* Extra Stats */}
                    {analysisResults[activeAnalysisView].extraStats && (
                      <div style={{ background: '#faf5ff', border: '1px solid #e9d5ff', padding: '8px 10px', borderRadius: '4px', margin: '8px 0', fontSize: '12px' }}>
                        <strong style={{ color: '#6b21a8' }}>Extra Stats:</strong>
                        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', gap: '6px', marginTop: '4px' }}>
                          <div><strong>Driving:</strong> {analysisResults[activeAnalysisView].extraStats.driverSkill || 'Observed driving skill'}</div>
                          <div><strong>Durability:</strong> {analysisResults[activeAnalysisView].extraStats.durability || 'Stable'}</div>
                          <div><strong>Human Player:</strong> {analysisResults[activeAnalysisView].extraStats.humanPlayer || 'N/A'}</div>
                          <div><strong>Other:</strong> {analysisResults[activeAnalysisView].extraStats.otherNotes || 'None'}</div>
                        </div>
                      </div>
                    )}

                    <div style={{ borderTop: '1px solid #eee', paddingTop: '8px', marginTop: '8px' }}>
                      <strong>Alliance Verdict:</strong> {analysisResults[activeAnalysisView].alliancePickRecommendation || analysisResults[activeAnalysisView].allianceSelectionVerdict || analysisResults[activeAnalysisView].strategicRecommendation}
                    </div>

                    {analysisResults[activeAnalysisView].detailedScoutNotes && (
                      <div style={{ marginTop: '8px', padding: '8px', background: '#f1f5f9', borderRadius: '4px', fontSize: '12px' }}>
                        <strong>Complete Qualitative Scout Notes:</strong>
                        <pre style={{ margin: '4px 0 0 0', whiteSpace: 'pre-wrap', fontFamily: 'inherit' }}>
                          {analysisResults[activeAnalysisView].detailedScoutNotes}
                        </pre>
                      </div>
                    )}
                  </div>
                </div>
              )}

              {/* Match Videos Table */}
              <table id="vt">
                <thead>
                  <tr>
                    <th style={{ textAlign: 'left' }}>Year</th>
                    <th style={{ textAlign: 'left' }}>Event</th>
                    <th style={{ textAlign: 'left' }}>Match</th>
                    <th style={{ textAlign: 'left' }}>Alliance & Barcode</th>
                    <th style={{ textAlign: 'right' }}>Score</th>
                    <th style={{ textAlign: 'left' }}>Result</th>
                    <th style={{ textAlign: 'left' }}>Video & AI Analysis</th>
                  </tr>
                </thead>
                <tbody>
                  {videoMatches.length === 0 ? (
                    <tr>
                      <td colSpan={7} style={{ textAlign: 'center', color: '#666', padding: '16px' }}>
                        {loadingVideos ? 'Loading matches...' : 'No matches loaded yet. Enter team number above and click Show match videos.'}
                      </td>
                    </tr>
                  ) : (
                    videoMatches.map((m) => {
                      const isAnalyzing = analyzingKey === m.matchKey;
                      const hasAnalysis = !!analysisResults[m.matchKey];
                      const clip = clipTimes[m.matchKey] || { start: '', end: '' };

                      return (
                        <tr key={m.matchKey}>
                          <td style={{ textAlign: 'left' }}>{m.year}</td>
                          <td style={{ textAlign: 'left' }}>{m.eventName}</td>
                          <td style={{ textAlign: 'left' }}>{m.label}</td>
                          <td style={{ textAlign: 'left', color: m.alliance === 'red' ? '#c00' : '#0066cc', fontWeight: 'bold' }}>
                            {m.alliance.toUpperCase()}
                            {m.telemetry?.station && (
                              <span style={{ fontSize: '11px', fontWeight: 'normal', color: '#555', marginLeft: '6px' }}>
                                [{m.telemetry.station}]
                              </span>
                            )}
                          </td>
                          <td style={{ textAlign: 'right' }}>{m.score}</td>
                          <td style={{ textAlign: 'left', color: m.result === 'Win' ? '#070' : m.result === 'Loss' ? '#c00' : '#444', fontWeight: m.result === 'Win' ? 'bold' : 'normal' }}>
                            {m.result}
                          </td>
                          <td style={{ textAlign: 'left', whiteSpace: 'nowrap' }}>
                            {m.videoUrl ? (
                              <div style={{ display: 'inline-flex', alignItems: 'center', gap: '8px' }}>
                                <a href={m.videoUrl} target="_blank" rel="noopener noreferrer" style={{ color: '#0066cc', textDecoration: 'underline' }}>
                                  Watch
                                </a>

                                <span style={{ fontSize: '11px', color: '#666' }}>
                                  Clip:{' '}
                                  <input
                                    placeholder="start"
                                    value={clip.start}
                                    onChange={(e) => setClipTimes({ ...clipTimes, [m.matchKey]: { ...clip, start: e.target.value } })}
                                    style={{ width: '38px', padding: '1px 3px', fontSize: '11px', border: '1px solid #ccc' }}
                                  />
                                  -
                                  <input
                                    placeholder="end"
                                    value={clip.end}
                                    onChange={(e) => setClipTimes({ ...clipTimes, [m.matchKey]: { ...clip, end: e.target.value } })}
                                    style={{ width: '38px', padding: '1px 3px', fontSize: '11px', border: '1px solid #ccc' }}
                                  />
                                  s
                                </span>

                                <button
                                  className="btn"
                                  onClick={() => handleAnalyzeVideo(m)}
                                  disabled={isAnalyzing}
                                  style={{
                                    padding: '2px 8px',
                                    fontSize: '12px',
                                    background: hasAnalysis ? '#e8f4fd' : '#f4f4f4',
                                    fontWeight: hasAnalysis ? 'bold' : 'normal',
                                  }}
                                >
                                  {isAnalyzing ? 'Analyzing...' : hasAnalysis ? 'Re-Analyze' : 'Analyze'}
                                </button>

                                {hasAnalysis && (
                                  <button
                                    className="btn"
                                    onClick={() => setActiveAnalysisView(activeAnalysisView === m.matchKey ? null : m.matchKey)}
                                    style={{ padding: '2px 6px', fontSize: '11px' }}
                                  >
                                    {activeAnalysisView === m.matchKey ? 'Hide' : 'View'}
                                  </button>
                                )}
                              </div>
                            ) : (
                              <span style={{ color: '#999', fontSize: '12px' }}>No video</span>
                            )}
                          </td>
                        </tr>
                      );
                    })
                  )}
                </tbody>
              </table>
            </div>
          )}

          {/* ================= TAB 3: SAVED REPORTS ================= */}
          {activeTab === 'reports' && (
            <div>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '10px' }}>
                <h3 style={{ margin: 0, fontSize: '18px', fontWeight: 'bold' }}>
                  Saved AI Tactical Scouting Reports ({savedReports.length})
                </h3>
                {savedReports.length > 0 && (
                  <button
                    className="btn"
                    onClick={() => {
                      if (confirm('Clear all saved tactical reports?')) setSavedReports([]);
                    }}
                  >
                    Clear All Reports
                  </button>
                )}
              </div>

              {savedReports.length === 0 ? (
                <div style={{ color: '#666', padding: '16px 0', fontSize: '13px' }}>
                  No tactical scouting reports saved yet. Analyze match videos in the "Video Analyzing" tab to automatically save reports here.
                </div>
              ) : (
                <div style={{ display: 'flex', flexDirection: 'column', gap: '12px' }}>
                  {savedReports.map((rep, idx) => (
                    <div key={idx} className="card" style={{ background: '#fff' }}>
                      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '6px' }}>
                        <div>
                          <strong style={{ fontSize: '15px' }}>Team {rep.teamNumber} — {rep.matchLabel}</strong>
                          <span style={{ fontSize: '11px', color: '#666', marginLeft: '10px' }}>{rep.analyzedAt}</span>
                        </div>
                        <div style={{ display: 'flex', gap: '6px' }}>
                          <button
                            className="btn"
                            style={{ padding: '2px 8px', fontSize: '12px' }}
                            onClick={() => {
                              const text = `Tactical Scouting Report: Team ${rep.teamNumber} (${rep.matchLabel})\nSummary: ${rep.summary}\nAuto: ${rep.auto?.exactAuto || rep.auto?.description}\nTransition: ${rep.transitionPeriod?.description}\nTeleop Inactive: ${rep.teleop?.inactiveNotes}\nTeleop Active: ${rep.teleop?.activeNotes}\nEndgame: ${rep.endgame?.description}\nVerdict: ${rep.allianceSelectionVerdict || rep.strategicRecommendation}`;
                              navigator.clipboard.writeText(text);
                              alert('Report copied to clipboard!');
                            }}
                          >
                            Copy Report
                          </button>
                          <button
                            className="btn"
                            style={{ padding: '2px 8px', fontSize: '12px', color: '#c00' }}
                            onClick={() => setSavedReports(savedReports.filter((_, i) => i !== idx))}
                          >
                            Delete
                          </button>
                        </div>
                      </div>
                      <div style={{ fontSize: '13px', lineHeight: '1.5' }}>
                        <p style={{ margin: '4px 0' }}><b>Summary:</b> {rep.summary}</p>
                        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(220px, 1fr))', gap: '8px', marginBottom: '8px', fontSize: '12px' }}>
                          <div style={{ padding: '6px', background: '#fcfcfc', border: '1px solid #ddd', borderRadius: '3px' }}>
                            <b style={{ color: '#1e3a8a' }}>Auto:</b>
                            <div style={{ marginTop: '2px' }}>{rep.auto?.exactAuto || rep.auto?.description}</div>
                          </div>
                          <div style={{ padding: '6px', background: '#fcfcfc', border: '1px solid #ddd', borderRadius: '3px' }}>
                            <b style={{ color: '#1e3a8a' }}>Transition Period:</b>
                            <div style={{ marginTop: '2px' }}>{rep.transitionPeriod?.description || 'Active field transition & neutral zone engagement.'}</div>
                          </div>
                          <div style={{ padding: '6px', background: '#fcfcfc', border: '1px solid #ddd', borderRadius: '3px' }}>
                            <b style={{ color: '#1e3a8a' }}>Teleop:</b>
                            <div style={{ marginTop: '2px' }}>
                              {rep.teleop?.inactiveNotes && <div><b>Inactive:</b> {rep.teleop.inactiveNotes}</div>}
                              {rep.teleop?.activeNotes && <div><b>Active:</b> {rep.teleop.activeNotes}</div>}
                              {!rep.teleop?.inactiveNotes && !rep.teleop?.activeNotes && <div>{rep.teleop?.description}</div>}
                            </div>
                          </div>
                          <div style={{ padding: '6px', background: '#fcfcfc', border: '1px solid #ddd', borderRadius: '3px' }}>
                            <b style={{ color: '#1e3a8a' }}>Endgame:</b>
                            <div style={{ marginTop: '2px' }}>{rep.endgame?.description}</div>
                          </div>
                        </div>
                        {rep.extraStats && (
                          <div style={{ padding: '6px', background: '#faf5ff', border: '1px solid #e9d5ff', borderRadius: '3px', marginBottom: '8px', fontSize: '11px' }}>
                            <b style={{ color: '#6b21a8' }}>Extra Stats:</b>
                            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(180px, 1fr))', gap: '6px', marginTop: '2px' }}>
                              <div><b>Driving:</b> {rep.extraStats?.driverSkill || 'Observed agile driving.'}</div>
                              <div><b>Durability:</b> {rep.extraStats?.durability || 'Remained intact.'}</div>
                              <div><b>Human Player:</b> {rep.extraStats?.humanPlayer || 'Not visible.'}</div>
                              <div><b>Other Quirks:</b> {rep.extraStats?.otherNotes || 'None.'}</div>
                            </div>
                          </div>
                        )}
                        <div style={{ fontSize: '12px', fontWeight: 'bold', color: '#1e3a8a', marginTop: '6px' }}>
                          Verdict: {rep.allianceSelectionVerdict || rep.strategicRecommendation || rep.alliancePickRecommendation}
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
