<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FRC Scouting & AI Video Analyzer</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            frcBlue: '#2563eb',
            frcRed: '#dc2626',
          }
        }
      }
    }
  </script>
  <!-- React 18, ReactDOM, & Babel -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { background-color: #0b0f19; color: #f3f4f6; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #111827; }
    ::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #4b5563; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const DEFAULT_SUPABASE_URL = "https://hiidxcirfnetdaagfsuh.supabase.co/functions/v1/analyze-video";

    function App() {
      // Configuration & Keys
      const [tbaKey, setTbaKey] = useState(() => localStorage.getItem('frc_tba_key') || '');
      const [functionUrl, setFunctionUrl] = useState(() => localStorage.getItem('frc_function_url') || DEFAULT_SUPABASE_URL);
      const [showSettings, setShowSettings] = useState(false);

      // Search filters
      const [teamNumber, setTeamNumber] = useState('3061');
      const [year, setYear] = useState('2024');
      const [activeTab, setActiveTab] = useState('matches'); // 'matches' | 'reports'

      // Data state
      const [teamInfo, setTeamInfo] = useState(null);
      const [events, setEvents] = useState([]);
      const [selectedEventKey, setSelectedEventKey] = useState('');
      const [matches, setMatches] = useState([]);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');

      // Analysis & Player state
      const [analyzingMatchKey, setAnalyzingMatchKey] = useState(null);
      const [activeAnalysis, setActiveAnalysis] = useState(null);
      const [selectedMatchForPlayer, setSelectedMatchForPlayer] = useState(null);

      // Saved Reports in localStorage
      const [savedReports, setSavedReports] = useState(() => {
        try {
          return JSON.parse(localStorage.getItem('frc_saved_reports') || '[]');
        } catch {
          return [];
        }
      });

      const handleSaveSettings = (newKey, newUrl) => {
        setTbaKey(newKey);
        setFunctionUrl(newUrl);
        localStorage.setItem('frc_tba_key', newKey);
        localStorage.setItem('frc_function_url', newUrl);
        setShowSettings(false);
      };

      useEffect(() => {
        localStorage.setItem('frc_saved_reports', JSON.stringify(savedReports));
      }, [savedReports]);

      // Load Team & Events from TBA
      const handleLoadTeam = async () => {
        if (!teamNumber.trim()) return;
        setLoading(true);
        setError('');
        setTeamInfo(null);
        setEvents([]);
        setMatches([]);

        const cleanKey = tbaKey.trim();
        const headers = cleanKey ? { 'X-TBA-Auth-Key': cleanKey } : {};

        try {
          const teamRes = await fetch(`https://www.thebluealliance.com/api/v3/team/frc${teamNumber.trim()}`, { headers });
          if (!teamRes.ok) throw new Error(teamRes.status === 401 ? 'Invalid or missing TBA Key. Click the Settings icon to add it.' : 'Team not found on The Blue Alliance');
          const teamData = await teamRes.json();
          setTeamInfo(teamData);

          const eventsRes = await fetch(`https://www.thebluealliance.com/api/v3/team/frc${teamNumber.trim()}/events/${year}`, { headers });
          if (eventsRes.ok) {
            const eventsData = await eventsRes.json();
            eventsData.sort((a, b) => (a.start_date || '').localeCompare(b.start_date || ''));
            setEvents(eventsData);
            if (eventsData.length > 0) {
              setSelectedEventKey(eventsData[0].key);
            }
          }
        } catch (err) {
          setError(err.message || 'Failed to fetch team data');
        } finally {
          setLoading(false);
        }
      };

      // Load Matches with TBA Driver Station Barcodes & FMS Telemetry
      useEffect(() => {
        if (!selectedEventKey || !teamNumber.trim()) return;

        const loadMatches = async () => {
          setLoading(true);
          setError('');
          const cleanKey = tbaKey.trim();
          const headers = cleanKey ? { 'X-TBA-Auth-Key': cleanKey } : {};

          try {
            const res = await fetch(`https://www.thebluealliance.com/api/v3/team/frc${teamNumber.trim()}/event/${selectedEventKey}/matches`, { headers });
            if (!res.ok) throw new Error('Failed to load event matches');
            const matchData = await res.json();

            const myKey = `frc${teamNumber.trim()}`;
            const processed = matchData.map(m => {
              const redKeys = m.alliances?.red?.team_keys || [];
              const blueKeys = m.alliances?.blue?.team_keys || [];
              const isRed = redKeys.includes(myKey);
              const isBlue = blueKeys.includes(myKey);
              const alliance = isRed ? 'red' : (isBlue ? 'blue' : 'unknown');

              // Driver Station slot (1, 2, or 3)
              let slot = 1;
              if (isRed) slot = redKeys.indexOf(myKey) + 1;
              if (isBlue) slot = blueKeys.indexOf(myKey) + 1;
              const stationName = alliance !== 'unknown' ? `${alliance.toUpperCase()} ${slot}` : 'Unknown';

              // Starting Barcode & Starting Line Position
              let barcode = `${stationName}`;
              if (slot === 1) barcode += ' (Amp Wall / Stage Left)';
              else if (slot === 2) barcode += ' (Subwoofer Center / Middle)';
              else if (slot === 3) barcode += ' (Source Side / Stage Right)';

              // Alliance partners & Opponents
              const partners = (isRed ? redKeys : blueKeys)
                .filter(k => k !== myKey)
                .map(k => k.replace('frc', ''))
                .join(', ');
              const opponents = (isRed ? blueKeys : redKeys)
                .map(k => k.replace('frc', ''))
                .join(', ');

              // FMS Telemetry breakdown
              const breakdown = m.score_breakdown?.[alliance] || {};

              // Auto Leave / Mobility Status
              let autoLeave = 'Unknown';
              const autoLine = breakdown[`autoLineRobot${slot}`];
              const autoMobility = breakdown[`autoMobilityRobot${slot}`] || breakdown[`mobilityRobot${slot}`];
              if (autoLine === 'Yes' || autoMobility === 'Yes' || autoMobility === true) {
                autoLeave = 'Verified Left Starting Line';
              } else if (autoLine === 'No' || autoMobility === 'No' || autoMobility === false) {
                autoLeave = 'Did NOT Leave Starting Line';
              }

              // Endgame Climb Status
              let endgame = 'Unknown';
              const endgameAction = breakdown[`endGameRobot${slot}`];
              if (endgameAction) endgame = endgameAction;

              // YouTube video link
              const ytVideo = (m.videos || []).find(v => v.type === 'youtube');
              const videoUrl = ytVideo ? `https://www.youtube.com/watch?v=${ytVideo.key}` : '';

              const myScore = m.alliances?.[alliance]?.score ?? 0;
              const oppScore = m.alliances?.[isRed ? 'blue' : 'red']?.score ?? 0;
              let result = '';
              if (myScore > oppScore) result = 'Win';
              else if (myScore < oppScore) result = 'Loss';
              else if (myScore === oppScore && myScore > 0) result = 'Tie';

              return {
                matchKey: m.key,
                matchNumber: m.match_number,
                compLevel: m.comp_level,
                label: `${m.comp_level.toUpperCase()} ${m.match_number}`,
                alliance,
                score: `${myScore} - ${oppScore}`,
                result,
                videoUrl,
                youtubeKey: ytVideo?.key || '',
                telemetry: {
                  station: stationName,
                  stationSlot: slot,
                  stationBarcode: barcode,
                  partners,
                  opponents,
                  autoLeave,
                  endgame,
                  autoPoints: breakdown.autoPoints ?? null,
                  teleopPoints: breakdown.teleopPoints ?? null,
                  endgamePoints: breakdown.endGamePoints ?? null,
                  totalPoints: breakdown.totalPoints ?? myScore,
                }
              };
            });

            // Sort qm, qf, sf, f
            const levelOrder = { qm: 1, ef: 2, qf: 3, sf: 4, f: 5 };
            processed.sort((a, b) => {
              const diff = (levelOrder[a.compLevel] || 99) - (levelOrder[b.compLevel] || 99);
              if (diff !== 0) return diff;
              return a.matchNumber - b.matchNumber;
            });

            setMatches(processed);
          } catch (err) {
            setError(err.message || 'Error loading matches');
          } finally {
            setLoading(false);
          }
        };

        loadMatches();
      }, [selectedEventKey]);

      // Call Video Analysis with Starting Barcode & Ground Truth Telemetry
      const handleAnalyzeMatch = async (match) => {
        if (!match.videoUrl) {
          alert('This match does not have a linked YouTube video on The Blue Alliance.');
          return;
        }

        setAnalyzingMatchKey(match.matchKey);
        setSelectedMatchForPlayer(match);
        setError('');

        const selectedEvent = events.find(e => e.key === selectedEventKey);
        const eventName = selectedEvent ? selectedEvent.name : 'FRC Event';

        const payload = {
          videoUrl: match.videoUrl,
          teamNumber: parseInt(teamNumber, 10),
          teamName: teamInfo?.nickname || `Team ${teamNumber}`,
          eventName,
          matchLabel: match.label,
          alliance: match.alliance,
          score: match.score,
          year: year,
          // Starting Barcode & Ground Truth Telemetry for calibration
          telemetry: match.telemetry
        };

        try {
          const res = await fetch(functionUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          if (!res.ok) {
            const errBody = await res.text();
            throw new Error(`Analysis failed (${res.status}): ${errBody}`);
          }

          const responseData = await res.json();
          const analysisData = responseData.data || responseData;

          const completeReport = {
            id: `${match.matchKey}_${Date.now()}`,
            teamNumber,
            teamName: teamInfo?.nickname || `Team ${teamNumber}`,
            matchLabel: match.label,
            matchKey: match.matchKey,
            eventName,
            year,
            videoUrl: match.videoUrl,
            youtubeKey: match.youtubeKey,
            telemetry: match.telemetry,
            timestamp: new Date().toISOString(),
            analysis: analysisData
          };

          setActiveAnalysis(completeReport);
          setSavedReports(prev => [completeReport, ...prev]);
        } catch (err) {
          console.error(err);
          setError(`AI Video Analysis Error: ${err.message}`);
        } finally {
          setAnalyzingMatchKey(null);
        }
      };

      return (
        <div className="min-h-screen flex flex-col bg-[#0b0f19] text-gray-100">
          {/* Header */}
          <header className="border-b border-gray-800 bg-gray-900/90 backdrop-blur sticky top-0 z-40 px-4 py-3 flex items-center justify-between">
            <div className="flex items-center space-x-3">
              <div className="w-9 h-9 rounded-lg bg-gradient-to-br from-blue-600 to-indigo-700 flex items-center justify-center font-black text-white text-lg shadow-md shadow-blue-500/20">
                FRC
              </div>
              <div>
                <h1 className="font-bold text-base md:text-lg leading-tight text-white flex items-center gap-2">
                  FRC Tactical Scouting & AI Video Analyzer
                  <span className="text-[10px] uppercase font-mono px-2 py-0.5 rounded bg-blue-500/20 text-blue-400 border border-blue-500/30">
                    TBA Barcode Calibrated
                  </span>
                </h1>
                <p className="text-xs text-gray-400">Computer vision scouting anchored by starting barcodes & referee telemetry</p>
              </div>
            </div>

            <div className="flex items-center space-x-2">
              <button
                onClick={() => setActiveTab('matches')}
                className={`px-3 py-1.5 rounded-md text-xs font-medium transition ${activeTab === 'matches' ? 'bg-blue-600 text-white shadow' : 'text-gray-400 hover:text-white hover:bg-gray-800'}`}
              >
                Match Video Scouting
              </button>
              <button
                onClick={() => setActiveTab('reports')}
                className={`px-3 py-1.5 rounded-md text-xs font-medium transition flex items-center gap-1 ${activeTab === 'reports' ? 'bg-blue-600 text-white shadow' : 'text-gray-400 hover:text-white hover:bg-gray-800'}`}
              >
                Saved Reports
                <span className="ml-1 px-1.5 py-0.2 rounded-full bg-gray-800 text-[10px] text-gray-300">
                  {savedReports.length}
                </span>
              </button>
              <button
                onClick={() => setShowSettings(true)}
                className="p-2 rounded-md text-gray-400 hover:text-white hover:bg-gray-800 border border-gray-700 transition"
                title="Configure TBA Key & Function URL"
              >
                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
              </button>
            </div>
          </header>

          {/* Search Bar */}
          <div className="bg-gray-900 border-b border-gray-800 px-4 py-3">
            <div className="max-w-7xl mx-auto flex flex-wrap items-center gap-3">
              <div className="flex items-center space-x-2 bg-gray-950 px-3 py-1.5 rounded-lg border border-gray-700">
                <span className="text-xs font-semibold text-gray-400">Team #</span>
                <input
                  type="text"
                  value={teamNumber}
                  onChange={(e) => setTeamNumber(e.target.value)}
                  placeholder="3061"
                  className="bg-transparent border-none text-white text-sm font-mono focus:outline-none w-20"
                />
              </div>

              <div className="flex items-center space-x-2 bg-gray-950 px-3 py-1.5 rounded-lg border border-gray-700">
                <span className="text-xs font-semibold text-gray-400">Season</span>
                <select
                  value={year}
                  onChange={(e) => setYear(e.target.value)}
                  className="bg-transparent border-none text-white text-sm focus:outline-none cursor-pointer"
                >
                  <option value="2026" className="bg-gray-900">2026 Season</option>
                  <option value="2025" className="bg-gray-900">2025 (Reefscape)</option>
                  <option value="2024" className="bg-gray-900">2024 (Crescendo)</option>
                  <option value="2023" className="bg-gray-900">2023 (Charged Up)</option>
                </select>
              </div>

              <button
                onClick={handleLoadTeam}
                disabled={loading}
                className="bg-blue-600 hover:bg-blue-500 disabled:opacity-50 text-white font-medium text-xs px-4 py-2 rounded-lg transition shadow-md shadow-blue-600/20"
              >
                {loading ? 'Fetching TBA...' : 'Load Team & Matches'}
              </button>

              {teamInfo && (
                <div className="ml-auto flex items-center space-x-2 bg-gray-800/80 px-3 py-1.5 rounded-lg border border-gray-700 text-xs">
                  <span className="font-bold text-white">#{teamInfo.team_number}</span>
                  <span className="text-gray-300">{teamInfo.nickname}</span>
                  <span className="text-gray-500">• {teamInfo.city}, {teamInfo.state_prov}</span>
                </div>
              )}
            </div>
          </div>

          {/* Error Message */}
          {error && (
            <div className="bg-red-950/80 border-b border-red-800 text-red-200 px-4 py-2.5 text-xs flex items-center justify-between">
              <span>{error}</span>
              <button onClick={() => setError('')} className="text-red-400 hover:text-white font-bold ml-4">✕</button>
            </div>
          )}

          {/* Main Area */}
          <main className="flex-1 max-w-7xl w-full mx-auto p-4 flex flex-col gap-6">
            {activeTab === 'matches' ? (
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                {/* Left Column: Matches */}
                <div className="lg:col-span-6 flex flex-col gap-4">
                  {events.length > 0 && (
                    <div className="bg-gray-900 border border-gray-800 rounded-xl p-4">
                      <label className="block text-xs font-semibold text-gray-400 mb-2">Select Regional / Event</label>
                      <select
                        value={selectedEventKey}
                        onChange={(e) => setSelectedEventKey(e.target.value)}
                        className="w-full bg-gray-950 border border-gray-700 text-white rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500"
                      >
                        {events.map(ev => (
                          <option key={ev.key} value={ev.key}>
                            {ev.name} ({ev.start_date || ''})
                          </option>
                        ))}
                      </select>
                    </div>
                  )}

                  <div className="bg-gray-900 border border-gray-800 rounded-xl p-4 flex flex-col">
                    <div className="flex items-center justify-between mb-3">
                      <h2 className="text-sm font-bold text-white flex items-center gap-2">
                        <span>Matches & Video Feeds</span>
                        <span className="text-xs font-normal text-gray-400">({matches.length} found)</span>
                      </h2>
                      <span className="text-[11px] text-emerald-400 flex items-center gap-1 font-mono">
                        ● Starting Barcodes Ready
                      </span>
                    </div>

                    {matches.length === 0 ? (
                      <div className="text-center py-12 text-gray-500 text-xs">
                        {loading ? 'Loading matches from The Blue Alliance...' : 'No matches loaded. Click "Load Team & Matches" above.'}
                      </div>
                    ) : (
                      <div className="overflow-x-auto">
                        <table className="w-full text-left text-xs border-collapse">
                          <thead>
                            <tr className="border-b border-gray-800 text-gray-400 font-semibold">
                              <th className="py-2 px-2">Match</th>
                              <th className="py-2 px-2">Starting Barcode</th>
                              <th className="py-2 px-2">Score</th>
                              <th className="py-2 px-2">Video</th>
                              <th className="py-2 px-2 text-right">Action</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-gray-800/60">
                            {matches.map(m => (
                              <tr key={m.matchKey} className="hover:bg-gray-800/40 transition">
                                <td className="py-2.5 px-2 font-mono font-medium text-white">
                                  {m.label}
                                </td>
                                <td className="py-2.5 px-2">
                                  <div className="flex flex-col">
                                    <span className={`inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-bold w-fit ${
                                      m.alliance === 'red' ? 'bg-red-950 text-red-300 border border-red-800' : 'bg-blue-950 text-blue-300 border border-blue-800'
                                    }`}>
                                      {m.telemetry.station}
                                    </span>
                                    <span className="text-[10px] text-gray-400 mt-0.5 truncate max-w-[140px]" title={m.telemetry.stationBarcode}>
                                      {m.telemetry.stationBarcode.replace(`${m.telemetry.station} `, '')}
                                    </span>
                                  </div>
                                </td>
                                <td className="py-2.5 px-2">
                                  <span className={`font-mono font-medium ${
                                    m.result === 'Win' ? 'text-green-400' : (m.result === 'Loss' ? 'text-red-400' : 'text-gray-300')
                                  }`}>
                                    {m.score}
                                  </span>
                                  <span className="text-[10px] text-gray-500 ml-1">({m.result})</span>
                                </td>
                                <td className="py-2.5 px-2">
                                  {m.videoUrl ? (
                                    <button
                                      onClick={() => setSelectedMatchForPlayer(m)}
                                      className="text-blue-400 hover:text-blue-300 flex items-center gap-1 font-medium"
                                    >
                                      Watch
                                    </button>
                                  ) : (
                                    <span className="text-gray-600 text-[11px]">No video</span>
                                  )}
                                </td>
                                <td className="py-2.5 px-2 text-right">
                                  <button
                                    onClick={() => handleAnalyzeMatch(m)}
                                    disabled={!m.videoUrl || analyzingMatchKey === m.matchKey}
                                    className={`px-2.5 py-1 rounded text-[11px] font-medium transition ${
                                      analyzingMatchKey === m.matchKey
                                        ? 'bg-amber-600/30 text-amber-300 border border-amber-500/50 animate-pulse'
                                        : m.videoUrl
                                          ? 'bg-blue-600 hover:bg-blue-500 text-white shadow'
                                          : 'bg-gray-800 text-gray-500 cursor-not-allowed'
                                    }`}
                                  >
                                    {analyzingMatchKey === m.matchKey ? 'Calibrating...' : 'Analyze Robot'}
                                  </button>
                                </td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    )}
                  </div>
                </div>

                {/* Right Column: Video Replay & Calibrated Report */}
                <div className="lg:col-span-6 flex flex-col gap-4">
                  {selectedMatchForPlayer && selectedMatchForPlayer.youtubeKey && (
                    <div className="bg-gray-900 border border-gray-800 rounded-xl p-3 overflow-hidden shadow-lg">
                      <div className="flex items-center justify-between mb-2">
                        <span className="text-xs font-bold text-gray-300 flex items-center gap-1.5">
                          <span className="w-2 h-2 rounded-full bg-red-500"></span>
                          {selectedMatchForPlayer.label} Match Replay
                        </span>
                        <span className="text-[11px] text-gray-400">
                          Starting Station: <strong className="text-white">{selectedMatchForPlayer.telemetry.station}</strong>
                        </span>
                      </div>
                      <div className="aspect-video w-full rounded-lg overflow-hidden bg-black border border-gray-800">
                        <iframe
                          className="w-full h-full"
                          src={`https://www.youtube.com/embed/${selectedMatchForPlayer.youtubeKey}?autoplay=1&rel=0`}
                          title="Match Video"
                          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                          allowFullScreen
                        ></iframe>
                      </div>
                    </div>
                  )}

                  {activeAnalysis ? (
                    <div className="bg-gray-900 border border-gray-800 rounded-xl p-5 flex flex-col gap-4 shadow-xl">
                      {/* Calibration Verification Banner */}
                      <div className="bg-emerald-950/60 border border-emerald-700/60 rounded-lg p-3 text-emerald-200 text-xs">
                        <div className="flex items-center justify-between mb-1.5">
                          <span className="font-bold flex items-center gap-1.5 text-emerald-300">
                            ✓ TBA Barcode & FMS Ground-Truth Calibrated
                          </span>
                          <span className="text-[10px] font-mono px-2 py-0.5 rounded bg-emerald-900/60 text-emerald-300 border border-emerald-700/40">
                            Confidence: {activeAnalysis.analysis?.confidence || 'High'}
                          </span>
                        </div>
                        <div className="grid grid-cols-2 gap-2 text-[11px] text-emerald-300/80 mt-2 border-t border-emerald-800/40 pt-2">
                          <div>
                            <strong>Starting Barcode:</strong> {activeAnalysis.telemetry?.stationBarcode || 'Verified'}
                          </div>
                          <div>
                            <strong>Alliance Partners:</strong> {activeAnalysis.telemetry?.partners || 'None'}
                          </div>
                          <div>
                            <strong>Official Auto Leave:</strong> {activeAnalysis.telemetry?.autoLeave || 'Verified'}
                          </div>
                          <div>
                            <strong>Official Endgame:</strong> {activeAnalysis.telemetry?.endgame || 'Audited'}
                          </div>
                        </div>
                      </div>

                      {/* Header */}
                      <div className="border-b border-gray-800 pb-3 flex items-center justify-between">
                        <div>
                          <h3 className="font-bold text-base text-white">
                            Tactical Scouting Report: Team {activeAnalysis.teamNumber} ({activeAnalysis.matchLabel})
                          </h3>
                          <p className="text-xs text-gray-400">{activeAnalysis.eventName} • {activeAnalysis.year}</p>
                        </div>
                        <span className="px-2.5 py-1 rounded text-xs font-bold bg-blue-900/60 text-blue-300 border border-blue-700">
                          Robot Tracked
                        </span>
                      </div>

                      {/* Executive Summary */}
                      <div className="text-xs text-gray-200 leading-relaxed bg-gray-950 p-3 rounded-lg border border-gray-800">
                        {activeAnalysis.analysis?.summary}
                      </div>

                      {/* Phase Ratings */}
                      <div className="grid grid-cols-1 md:grid-cols-3 gap-3 text-xs">
                        <div className="bg-gray-950 p-3 rounded-lg border border-gray-800">
                          <div className="flex justify-between items-center mb-1">
                            <span className="font-semibold text-gray-400">Autonomous</span>
                            <span className="font-bold text-blue-400">{activeAnalysis.analysis?.auto?.rating ?? 'N/A'}/10</span>
                          </div>
                          <p className="text-[11px] text-gray-300">{activeAnalysis.analysis?.auto?.description}</p>
                        </div>

                        <div className="bg-gray-950 p-3 rounded-lg border border-gray-800">
                          <div className="flex justify-between items-center mb-1">
                            <span className="font-semibold text-gray-400">Teleop Cycling</span>
                            <span className="font-bold text-blue-400">{activeAnalysis.analysis?.teleop?.rating ?? 'N/A'}/10</span>
                          </div>
                          <p className="text-[11px] text-gray-300">{activeAnalysis.analysis?.teleop?.description}</p>
                        </div>

                        <div className="bg-gray-950 p-3 rounded-lg border border-gray-800">
                          <div className="flex justify-between items-center mb-1">
                            <span className="font-semibold text-gray-400">Endgame</span>
                            <span className="font-bold text-blue-400">{activeAnalysis.analysis?.endgame?.rating ?? 'N/A'}/10</span>
                          </div>
                          <p className="text-[11px] text-gray-300">{activeAnalysis.analysis?.endgame?.description}</p>
                        </div>
                      </div>

                      {/* Strengths & Weaknesses */}
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-3 text-xs">
                        <div className="bg-emerald-950/20 border border-emerald-900/40 p-3 rounded-lg">
                          <span className="font-semibold text-emerald-400 block mb-1">Key Strengths</span>
                          <ul className="list-disc list-inside text-[11px] text-emerald-200/90 space-y-0.5">
                            {(activeAnalysis.analysis?.strengths || []).map((s, idx) => (
                              <li key={idx}>{s}</li>
                            ))}
                          </ul>
                        </div>
                        <div className="bg-rose-950/20 border border-rose-900/40 p-3 rounded-lg">
                          <span className="font-semibold text-rose-400 block mb-1">Liabilities & Traffic</span>
                          <ul className="list-disc list-inside text-[11px] text-rose-200/90 space-y-0.5">
                            {(activeAnalysis.analysis?.weaknesses || []).map((w, idx) => (
                              <li key={idx}>{w}</li>
                            ))}
                          </ul>
                        </div>
                      </div>

                      {/* Alliance Recommendation */}
                      <div className="bg-indigo-950/30 border border-indigo-900/50 p-3 rounded-lg text-xs">
                        <span className="font-semibold text-indigo-300 block mb-1">Alliance Draft Recommendation</span>
                        <p className="text-[11px] text-indigo-100">{activeAnalysis.analysis?.alliancePickRecommendation}</p>
                      </div>
                    </div>
                  ) : (
                    <div className="bg-gray-900/60 border border-dashed border-gray-800 rounded-xl p-12 text-center text-gray-500 text-xs">
                      Select a match from the table on the left and click <strong>"Analyze Robot"</strong> to generate a barcode-calibrated tactical scouting report.
                    </div>
                  )}
                </div>
              </div>
            ) : (
              /* Saved Reports View */
              <div className="bg-gray-900 border border-gray-800 rounded-xl p-5 flex flex-col gap-4">
                <div className="flex items-center justify-between border-b border-gray-800 pb-3">
                  <h2 className="text-base font-bold text-white">Saved Tactical Scouting Reports</h2>
                  {savedReports.length > 0 && (
                    <button
                      onClick={() => {
                        if (confirm('Clear all saved scouting reports?')) setSavedReports([]);
                      }}
                      className="text-xs text-rose-400 hover:text-rose-300 font-medium"
                    >
                      Clear All Reports
                    </button>
                  )}
                </div>

                {savedReports.length === 0 ? (
                  <div className="text-center py-16 text-gray-500 text-xs">
                    No saved reports yet. Run an analysis from the Match Video Scouting tab.
                  </div>
                ) : (
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    {savedReports.map(rep => (
                      <div key={rep.id} className="bg-gray-950 border border-gray-800 rounded-xl p-4 flex flex-col gap-2 hover:border-gray-700 transition">
                        <div className="flex items-center justify-between">
                          <span className="font-bold text-sm text-white">Team {rep.teamNumber} • {rep.matchLabel}</span>
                          <span className="text-[10px] text-gray-500">{new Date(rep.timestamp).toLocaleDateString()}</span>
                        </div>
                        <span className="text-xs text-gray-400">{rep.eventName}</span>
                        <div className="bg-gray-900 p-2.5 rounded-lg text-xs text-gray-300 my-1 line-clamp-3">
                          {rep.analysis?.summary}
                        </div>
                        <div className="flex items-center justify-between text-xs mt-2 pt-2 border-t border-gray-850">
                          <span className="text-[11px] text-emerald-400 font-medium">
                            Station: {rep.telemetry?.stationBarcode || rep.telemetry?.station}
                          </span>
                          <button
                            onClick={() => {
                              setActiveAnalysis(rep);
                              setActiveTab('matches');
                            }}
                            className="text-blue-400 hover:text-blue-300 font-medium text-xs"
                          >
                            View Full Report →
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}
          </main>

          {/* Settings Modal */}
          {showSettings && (
            <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-gray-900 border border-gray-800 rounded-xl max-w-md w-full p-6 shadow-2xl flex flex-col gap-4">
                <div className="flex items-center justify-between border-b border-gray-800 pb-3">
                  <h3 className="font-bold text-white text-base">API & Function Settings</h3>
                  <button onClick={() => setShowSettings(false)} className="text-gray-400 hover:text-white">✕</button>
                </div>

                <div className="flex flex-col gap-3 text-xs">
                  <div>
                    <label className="block text-gray-300 font-semibold mb-1">
                      The Blue Alliance (TBA) Auth Key
                    </label>
                    <input
                      type="password"
                      id="input_tba_key"
                      defaultValue={tbaKey}
                      placeholder="Paste your TBA API Key..."
                      className="w-full bg-gray-950 border border-gray-700 rounded-lg p-2.5 text-white font-mono text-xs focus:outline-none focus:border-blue-500"
                    />
                    <p className="text-[11px] text-gray-500 mt-1">
                      Obtain from thebluealliance.com/account (Account → Read API Keys)
                    </p>
                  </div>

                  <div>
                    <label className="block text-gray-300 font-semibold mb-1">
                      Supabase Video Function URL
                    </label>
                    <input
                      type="text"
                      id="input_fn_url"
                      defaultValue={functionUrl}
                      placeholder={DEFAULT_SUPABASE_URL}
                      className="w-full bg-gray-950 border border-gray-700 rounded-lg p-2.5 text-white font-mono text-xs focus:outline-none focus:border-blue-500"
                    />
                    <p className="text-[11px] text-gray-500 mt-1">
                      Your Supabase Edge Function URL
                    </p>
                  </div>
                </div>

                <div className="flex items-center justify-end gap-2 pt-3 border-t border-gray-800">
                  <button
                    onClick={() => setShowSettings(false)}
                    className="px-4 py-2 rounded-lg text-xs font-medium text-gray-400 hover:text-white hover:bg-gray-800 transition"
                  >
                    Cancel
                  </button>
                  <button
                    onClick={() => {
                      const k = document.getElementById('input_tba_key').value;
                      const u = document.getElementById('input_fn_url').value;
                      handleSaveSettings(k, u);
                    }}
                    className="px-4 py-2 rounded-lg text-xs font-semibold bg-blue-600 hover:bg-blue-500 text-white shadow-md transition"
                  >
                    Save Settings
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
